name: Mikhbar Automation CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/forum/**'
      - '.github/workflows/forum-collector.yml'
      - '.github/workflows/forum-publisher-backup.yml'
      - '.github/workflows/forum-ci.yml'

permissions:
  contents: read

concurrency:
  group: mikhbar-automation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Compile publisher modules
        run: python -m py_compile automation/forum/writer.py automation/forum/publisher.py automation/forum/publisher_scheduler.py automation/forum/data_only_scheduler.py automation/forum/trend.py
      - name: Run forum automation tests
        run: python -m unittest discover -s automation/forum/tests -v
