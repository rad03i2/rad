name: RDWAN Tech Article Rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forum/templates/**'
      - 'forum/content/**/*.json'
      - 'automation/forum/renderer.py'
      - 'automation/forum/rebuild_articles.py'
      - '.github/workflows/forum-rebuild.yml'

permissions:
  contents: write

concurrency:
  group: rdwan-tech-article-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt

      - name: Test renderer
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Rebuild all structured articles
        run: python automation/forum/rebuild_articles.py

      - name: Commit rebuilt article pages
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum
          if git diff --cached --quiet; then
            echo "Article pages already match the shared template."
            exit 0
          fi
          git commit -m "RDWAN Tech: rebuild articles from shared template"
          git pull --rebase origin main
          git push origin HEAD:main
