name: RDWAN Tech Article Rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forum/templates/**'
      - 'forum/content/**/*.json'
      - 'forum/forum-media.css'
      - 'automation/forum/renderer.py'
      - 'automation/forum/indexes.py'
      - 'automation/forum/publisher.py'
      - 'automation/forum/image_pipeline.py'
      - 'automation/forum/writer.py'
      - 'automation/forum/build_locale_pages.py'
      - 'automation/forum/seo_finalize.py'
      - 'automation/forum/migrate_legacy_content.py'
      - 'automation/forum/rebuild_articles.py'
      - 'automation/forum/rebuild_indexes.py'
      - 'automation/forum/tests/test_*.py'
      - 'automation/forum/requirements.txt'
      - '.github/workflows/forum-rebuild.yml'

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: rdwan-tech-article-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Test publishing architecture
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Migrate legacy articles to bilingual structured content
        run: python automation/forum/migrate_legacy_content.py

      - name: Build Arabic and English publication pages
        run: python automation/forum/build_locale_pages.py

      - name: Rebuild all structured articles
        run: python automation/forum/rebuild_articles.py

      - name: Rebuild feeds and search indexes
        run: python automation/forum/rebuild_indexes.py

      - name: Finalize SEO indexability
        run: python automation/forum/seo_finalize.py

      - name: Commit rebuilt publication
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum sitemap.xml
          if git diff --cached --quiet; then
            echo "Publication already matches bilingual templates."
            exit 0
          fi
          git commit -m "RDWAN Tech: rebuild bilingual image-rich publication"
          git pull --rebase origin main
          git push origin HEAD:main
