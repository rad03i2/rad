name: RDWAN Tech Article Rebuild
# Maintenance-only rebuild. Normal automated publishing already rebuilds the
# required pages, indexes and SEO output, so this workflow is intentionally
# manual to avoid duplicate write jobs and noisy push-trigger failures.

on:
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: rdwan-tech-publication-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Test publishing architecture
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Migrate legacy articles to bilingual structured content
        run: python automation/forum/migrate_legacy_content.py

      - name: Build Arabic and English publication pages
        run: python automation/forum/build_locale_pages.py

      - name: Rebuild all structured articles
        run: python automation/forum/rebuild_articles.py

      - name: Rebuild feeds and search indexes
        run: python automation/forum/rebuild_indexes.py

      - name: Finalize SEO indexability
        run: python automation/forum/seo_finalize.py

      - name: Normalize canonical host across HTML
        run: python automation/seo/normalize_html.py

      - name: Commit rebuilt publication
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum sitemap.xml
          git add -- ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "Publication already matches bilingual templates and canonical host rules."
            exit 0
          fi
          git commit -m "RDWAN Tech: rebuild bilingual publication and normalize canonical host"
          git pull --rebase origin main
          git push origin HEAD:main
