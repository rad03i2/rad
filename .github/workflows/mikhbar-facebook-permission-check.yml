name: Mikhbar Facebook Permission Check

on:
  push:
    paths:
      - 'automation/social/facebook_permission_check_trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-check:
    runs-on: ubuntu-latest
    env:
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Inspect granted Facebook permissions safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          token = os.environ["FACEBOOK_USER_ACCESS_TOKEN"]
          req = Request(
              "https://graph.facebook.com/me/permissions",
              headers={"Authorization": "Bearer " + token},
          )
          with urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode())
          safe = [
              {"permission": x.get("permission"), "status": x.get("status")}
              for x in data.get("data", [])
          ]
          print(json.dumps({"permissions": safe}, ensure_ascii=False))
          PY
