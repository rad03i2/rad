name: Deploy Mikhbar External Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/external-scheduler/cloudflare/**
      - .github/workflows/deploy-cloudflare-scheduler.yml

concurrency:
  group: mikhbar-external-scheduler-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation/external-scheduler/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Test external scheduler
        run: node --test tests/*.test.mjs

      - name: Validate new or existing Worker dispatch credential
        shell: bash
        env:
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.RDWAN_SCHEDULER_GITHUB_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import urllib.error
          import urllib.request
          if os.environ.get('SCHEDULER_GITHUB_TOKEN'):
              print('Repository dispatch credential is configured.')
              raise SystemExit(0)
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/rdwan-tech-publisher-wakeup/settings'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Worker credential lookup returned HTTP {error.code}; configure RDWAN_SCHEDULER_GITHUB_TOKEN.')
          bindings = (payload.get('result') or {}).get('bindings') or []
          configured = any(binding.get('name') == 'GITHUB_TOKEN' and binding.get('type') == 'secret_text' for binding in bindings)
          if not configured:
              raise SystemExit('Missing RDWAN_SCHEDULER_GITHUB_TOKEN and no existing Worker GITHUB_TOKEN secret.')
          print('Preserving the existing Worker GITHUB_TOKEN secret; no credential value was read.')
          PYCODE

      - name: Deploy Worker and cron trigger
        id: worker
        shell: bash
        run: |
          npx wrangler deploy | tee /tmp/mikhbar-scheduler-deploy.log
          WORKER_URL="$(python - <<'PYCODE'
          import re
          from pathlib import Path
          text = Path('/tmp/mikhbar-scheduler-deploy.log').read_text()
          match = re.search(r'https://rdwan-tech-publisher-wakeup[^\s]*\.workers\.dev', text)
          if not match:
              raise SystemExit('Worker URL missing from deployment output')
          print(match.group(0))
          PYCODE
          )"
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Install GitHub dispatch token in Worker
        shell: bash
        env:
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.RDWAN_SCHEDULER_GITHUB_TOKEN }}
        run: |
          if [ -n "$SCHEDULER_GITHUB_TOKEN" ]; then
            printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          else
            echo "Keeping the previously validated Worker GITHUB_TOKEN secret."
          fi

      - name: Install protected manual trigger key when configured
        shell: bash
        env:
          MANUAL_TRIGGER_KEY: ${{ secrets.RDWAN_SCHEDULER_MANUAL_KEY }}
        run: |
          if [ -n "$MANUAL_TRIGGER_KEY" ]; then
            printf '%s' "$MANUAL_TRIGGER_KEY" | npx wrangler secret put MANUAL_TRIGGER_KEY
          else
            echo "RDWAN_SCHEDULER_MANUAL_KEY is not configured; /trigger remains disabled (401)."
          fi

      - name: Confirm deployment metadata
        run: npx wrangler deployments list

      - name: Verify configured Worker and authenticated GitHub dispatch
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          GH_TOKEN: ${{ secrets.RDWAN_SCHEDULER_GITHUB_TOKEN }}
        run: |
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$WORKER_URL/health" -o /tmp/mikhbar-scheduler-health.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/mikhbar-scheduler-health.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('schedule') == '*/5 * * * *', health
          assert health.get('publication_minimum_minutes') == 20, health
          print('External scheduler health and configuration verified.')
          PYCODE
          if [ -n "$GH_TOKEN" ]; then
            gh api --method GET repos/rad03i2/rad/actions/workflows/forum-collector.yml/runs -f per_page=1 > /dev/null
            gh workflow run forum-collector.yml --ref main -f trigger=external-scheduler-deployment-check
          else
            echo "Existing Worker secret retained; verify authenticated dispatch in the next scheduled Worker event."
          fi
