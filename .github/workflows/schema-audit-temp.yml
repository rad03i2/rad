name: Final schema.org validation temporary

on:
  push:
    paths:
      - '.github/workflows/schema-audit-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for live deployment
        run: sleep 30
      - name: Validate live pages with validator.schema.org
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import requests,re,json
          urls=[
            'https://rdwan.dev/',
            'https://rdwan.dev/about-radwan-abdulhadi.html',
            'https://rdwan.dev/projects/',
            'https://rdwan.dev/projects/01-smart-file-manager.html',
            'https://rdwan.dev/projects/08-arabic-ui-components.html',
            'https://rdwan.dev/blog/',
            'https://rdwan.dev/blog/smart-file-manager-csharp-winui3.html',
            'https://rdwan.dev/blog/robotics-language-lab-multi-language.html',
            'https://rdwan.dev/blog/arabic-rtl-ui-components.html',
            'https://rdwan.dev/notes/',
            'https://rdwan.dev/notes/duplicate-files-size-then-sha256.html'
          ]
          for u in urls:
            r=requests.post('https://validator.schema.org/validate',data={'url':u},timeout=60,headers={'User-Agent':'Mozilla/5.0'})
            text=r.text
            err=re.search(r'"numErrors"\s*:\s*(\d+)',text)
            warn=re.search(r'"numWarnings"\s*:\s*(\d+)',text)
            fetch=re.search(r'"fetchError"\s*:\s*"([^"]+)"',text)
            rendered=re.search(r'"isRendered"\s*:\s*(true|false)',text)
            types=sorted(set(re.findall(r'"value"\s*:\s*"(Person|WebSite|ProfilePage|ItemList|WebPage|SoftwareSourceCode|BreadcrumbList|TechArticle|CollectionPage|Blog)"',text)))
            print('SCHEMA_RESULT',json.dumps({'url':u,'http':r.status_code,'fetchError':fetch.group(1) if fetch else None,'isRendered':rendered.group(1) if rendered else None,'numErrors':int(err.group(1)) if err else None,'numWarnings':int(warn.group(1)) if warn else None,'types':types},ensure_ascii=False))
          PY
