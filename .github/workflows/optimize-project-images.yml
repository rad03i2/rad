name: Optimize project images

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/images/projects/**/*.jpg'
      - 'assets/images/projects/**/*.jpeg'
      - 'assets/images/projects/**/*.png'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert new JPG and PNG files to WebP
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob
          changed=0
          for src in assets/images/projects/**/*.{jpg,jpeg,png}; do
            [ -f "$src" ] || continue
            out="${src%.*}.webp"
            cwebp -quiet -q 86 "$src" -o "$out"
            rm "$src"
            changed=1
          done
          echo "changed=$changed" >> "$GITHUB_ENV"
      - name: Commit optimized images
        if: env.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/images/projects
          git commit -m 'Optimize project images to WebP' || exit 0
          git push
