name: RDWAN Tech Re-render Historical Articles

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rdwan-tech-publication-write
  cancel-in-progress: false

jobs:
  rerender:
    if: contains(github.event.head_commit.message, '[rerender-articles]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install forum dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt

      - name: Re-render every historical article
        run: python automation/forum/rerender_all_articles.py

      - name: Commit refreshed article pages
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum
          if git diff --cached --quiet; then
            echo "All historical articles were already current."
            exit 0
          fi
          git commit -m "RDWAN Tech: refresh historical article author portrait"
          git pull --rebase origin main
          git push origin HEAD:main
