name: Temporary Mikhbar Brand SEO CI

on:
  push:
    branches:
      - seo/brand-search-mikhbar

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate Python generators
        run: python -m py_compile automation/forum/build_locale_pages.py cloudflare/mikhbar-site/build.py
      - name: Validate dynamic article JavaScript
        run: |
          node --check forum/article/article.js
          node --check cloudflare/mikhbar-site/src/article.js
          node --check cloudflare/mikhbar-site/src/index.js
      - name: Run forum automation tests
        run: python -m unittest discover -s automation/forum/tests -v
      - name: Build Cloudflare static assets
        run: python cloudflare/mikhbar-site/build.py
      - name: Audit deployed sitemap completeness
        run: python automation/forum/audit_deployed_sitemap.py
      - name: Validate branded search identity
        shell: bash
        run: |
          grep -q '"@type":"WebSite"' dist/mikhbar/ar/index.html
          grep -q '"@type":"WebSite"' dist/mikhbar/en/index.html
          grep -q '"مخبار"' dist/mikhbar/ar/index.html
          grep -q '"مخبار"' dist/mikhbar/en/index.html
          grep -q 'مخبار دون تشكيل' dist/mikhbar/about/index.html
          grep -q '"alternateName":\["مِخبار","مخبار","MIKHBAR","mikhbar.website"\]' dist/mikhbar/index.html
          if grep -q 'rdwan.dev' dist/mikhbar/ar/index.html dist/mikhbar/en/index.html dist/mikhbar/about/index.html; then
            echo "Legacy rdwan.dev identity leaked into branded pages" >&2
            exit 1
          fi
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
