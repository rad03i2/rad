name: Mikhbar Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches: [main]
    paths:
      - 'forum/**'
      - 'automation/forum/indexes.py'
      - 'automation/forum/rebuild_indexes.py'
      - 'automation/forum/normalize_public_identity.py'
      - 'automation/forum/enhance_category_seo.py'
      - 'automation/forum/audit_search_quality.py'
      - 'automation/forum/audit_deployed_sitemap.py'
      - 'assets/brand/mikhbar/**'
      - 'assets/images/**'
      - 'assets/social/**'
      - 'cloudflare/mikhbar-site/**'
      - '.github/workflows/deploy-mikhbar-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: mikhbar-cloudflare-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Mikhbar search quality
        run: python automation/forum/audit_search_quality.py

      - name: Enhance Mikhbar search topic hubs
        run: python automation/forum/enhance_category_seo.py

      - name: Rebuild Mikhbar search discovery files
        run: python automation/forum/rebuild_indexes.py

      - name: Build Mikhbar static distribution
        run: python cloudflare/mikhbar-site/build.py

      - name: Audit deployed sitemap completeness
        run: python automation/forum/audit_deployed_sitemap.py

      - name: Validate standalone Mikhbar search output
        shell: bash
        run: |
          test -f dist/mikhbar/index.html
          test -f dist/mikhbar/ar/index.html
          test -f dist/mikhbar/en/index.html
          test -f dist/mikhbar/ar/ai/index.html
          test -f dist/mikhbar/en/ai/index.html
          test -f dist/mikhbar/sitemap.xml
          test -f dist/mikhbar/news-sitemap.xml
          test -f dist/mikhbar/robots.txt
          test -f dist/mikhbar/contact/index.html
          grep -q 'أخبار الذكاء الاصطناعي وأدوات AI وتطبيقاته' dist/mikhbar/ar/ai/index.html
          grep -q 'أخبار وأدوات الذكاء الاصطناعي في مكان واحد' dist/mikhbar/ar/ai/index.html
          grep -q 'Artificial Intelligence News Updates & AI Tools' dist/mikhbar/en/ai/index.html
          grep -q 'Artificial intelligence news, tools and model updates' dist/mikhbar/en/ai/index.html
          grep -q 'https://mikhbar.website/contact/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/about/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/editorial-policy/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/corrections/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/ai-policy/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/authors/radwan-abdulhadi/' dist/mikhbar/sitemap.xml
          LEGACY_FILES="$(grep -RIl --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.ico' 'rdwan.dev' dist/mikhbar || true)"
          if [ -n "$LEGACY_FILES" ]; then
            echo 'Legacy rdwan.dev identity remains in these Mikhbar deployment files:' >&2
            printf '%s\n' "$LEGACY_FILES" >&2
            exit 1
          fi
          grep -q 'https://mikhbar.website' dist/mikhbar/sitemap.xml

      - name: Select deployment target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker and static assets when Cloudflare credentials exist
        working-directory: cloudflare/mikhbar-site
        shell: bash
        env:
          DEPLOY_TARGET: ${{ steps.target.outputs.value }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured. Build validation succeeded, but no remote deployment was attempted."
            exit 0
          fi

          if [ "$DEPLOY_TARGET" = "production" ]; then
            CONFIG="wrangler.production.toml"
          else
            CONFIG="wrangler.preview.toml"
          fi

          echo "Deploying Mikhbar target=$DEPLOY_TARGET config=$CONFIG"
          npx --yes wrangler@latest deploy --config "$CONFIG"

      - name: Verify live production SSR and internal links
        shell: bash
        env:
          DEPLOY_TARGET: ${{ steps.target.outputs.value }}
        run: |
          if [ "$DEPLOY_TARGET" != "production" ]; then
            echo "Preview deployment selected; skipping production-domain smoke test."
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials were unavailable; no new production deployment was attempted."
            exit 0
          fi

          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors https://mikhbar.website/healthz | grep -q '"ok":true'

          ARTICLE_PATH="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('dist/mikhbar/posts-en.json').read_text(encoding='utf-8'))
          posts = payload.get('posts', []) if isinstance(payload, dict) else payload
          for post in posts:
              if str(post.get('categorySlug') or '') != 'ai':
                  continue
              path = str(post.get('url') or '')
              if path.startswith('/forum/'):
                  path = path[len('/forum'):]
              if path.startswith('/en/ai/'):
                  print(path)
                  break
          PY
          )"
          test -n "$ARTICLE_PATH"

          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "https://mikhbar.website${ARTICLE_PATH}" -o /tmp/mikhbar-live-article.html
          grep -q 'data-ssr-rendered="true"' /tmp/mikhbar-live-article.html
          grep -q 'class="rt-section rt-related-stories"' /tmp/mikhbar-live-article.html
          grep -q 'Related stories' /tmp/mikhbar-live-article.html
          grep -Fq "rel=\"canonical\" href=\"https://mikhbar.website${ARTICLE_PATH}\"" /tmp/mikhbar-live-article.html
          if grep -q 'rdwan.dev' /tmp/mikhbar-live-article.html; then
            echo "Legacy rdwan.dev identity appeared in live article HTML." >&2
            exit 1
          fi
          echo "Live Mikhbar SSR smoke test passed for ${ARTICLE_PATH}"
