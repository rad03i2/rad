name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'forum/**'
      - 'automation/forum/indexes.py'
      - 'automation/forum/rebuild_indexes.py'
      - 'automation/forum/enhance_category_seo.py'
      - 'automation/forum/audit_deployed_sitemap.py'
      - 'cloudflare/mikhbar-site/build.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enhance Mikhbar search topic hubs
        run: python automation/forum/enhance_category_seo.py

      - name: Rebuild Mikhbar search discovery files
        run: python automation/forum/rebuild_indexes.py

      - name: Build canonical Mikhbar distribution
        run: python cloudflare/mikhbar-site/build.py

      - name: Audit deployed sitemap completeness
        run: python automation/forum/audit_deployed_sitemap.py

      - name: Validate trust and topic URLs before submission
        shell: bash
        run: |
          grep -q 'أخبار الذكاء الاصطناعي وأدوات AI وتطبيقاته' dist/mikhbar/ar/ai/index.html
          grep -q 'Artificial Intelligence News Updates & AI Tools' dist/mikhbar/en/ai/index.html
          grep -q 'https://mikhbar.website/contact/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/about/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/editorial-policy/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/corrections/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/ai-policy/' dist/mikhbar/sitemap.xml
          grep -q 'https://mikhbar.website/authors/radwan-abdulhadi/' dist/mikhbar/sitemap.xml

      - name: Submit Mikhbar URLs to IndexNow
        shell: bash
        env:
          SITE_URL: https://mikhbar.website
          INDEXNOW_KEY: ff7de3f199bfcac8fda652aec7caabcd
        run: |
          if ! curl -fsS --max-time 12 "$SITE_URL/" >/dev/null; then
            echo "mikhbar.website is not reachable yet; skipping IndexNow without failing."
            exit 0
          fi
          python - <<'PY2' > /tmp/indexnow.json
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path('dist/mikhbar/sitemap.xml')
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = []
          if sitemap.exists():
              root = ET.parse(sitemap).getroot()
              urls.extend(x.text for x in root.findall('.//s:loc', ns) if x.text)
          urls = list(dict.fromkeys(urls))
          site = os.environ['SITE_URL'].rstrip('/')
          host = site.split('://', 1)[1].split('/')[0]
          print(json.dumps({
              'host': host,
              'key': os.environ['INDEXNOW_KEY'],
              'keyLocation': site + '/' + os.environ['INDEXNOW_KEY'] + '.txt',
              'urlList': urls[:10000],
          }))
          PY2
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json
          echo "IndexNow submission sent for mikhbar.website."
