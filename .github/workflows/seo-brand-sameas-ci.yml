name: Temporary Mikhbar Brand sameAs CI

on:
  push:
    branches:
      - seo/brand-sameas-reference

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate Python
        run: python -m py_compile automation/forum/build_locale_pages.py automation/forum/generate_trust_pages.py cloudflare/mikhbar-site/build.py
      - name: Regenerate key pages
        run: |
          python automation/forum/build_locale_pages.py
          python automation/forum/generate_trust_pages.py
          python automation/forum/normalize_public_identity.py
          python automation/forum/rebuild_indexes.py
      - name: Verify source sameAs
        run: |
          grep -Fq 'https://rdwan.dev/mikhbar.html' forum/ar/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' forum/en/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' forum/about/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' forum/en/about/index.html
      - name: Build Cloudflare output
        run: python cloudflare/mikhbar-site/build.py
      - name: Verify deployable sameAs
        run: |
          grep -Fq 'https://rdwan.dev/mikhbar.html' dist/mikhbar/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' dist/mikhbar/ar/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' dist/mikhbar/en/index.html
          grep -Fq 'https://rdwan.dev/mikhbar.html' dist/mikhbar/about/index.html
      - name: Audit deployed sitemap
        run: python automation/forum/audit_deployed_sitemap.py
