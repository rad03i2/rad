name: Live site audit temporary

on:
  push:
    paths:
      - '.github/workflows/site-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Run live audit
        shell: bash
        run: |
          python <<'PY'
          import json, requests, re, sys
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urls = [
            'https://rdwan.dev/',
            'https://www.rdwan.dev/',
            'https://rdwan.dev/robots.txt',
            'https://rdwan.dev/sitemap.xml',
            'https://rdwan.dev/about-radwan-abdulhadi.html',
            'https://rdwan.dev/projects/',
            'https://rdwan.dev/services/',
            'https://rdwan.dev/projects/01-smart-file-manager.html',
            'https://rdwan.dev/assets/social/home.jpg',
            'https://rdwan.dev/assets/social/project-01.jpg',
          ]
          headers={'User-Agent':'Mozilla/5.0 (compatible; RADSiteAudit/1.0)'}
          print('=== HTTP / REDIRECT AUDIT ===')
          for u in urls:
            try:
              r=requests.get(u,headers=headers,timeout=25,allow_redirects=True)
              print(json.dumps({'url':u,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content)},ensure_ascii=False))
            except Exception as e:
              print(json.dumps({'url':u,'error':str(e)},ensure_ascii=False))

          print('\n=== META / SOCIAL / SCHEMA AUDIT ===')
          for u in ['https://rdwan.dev/','https://rdwan.dev/projects/01-smart-file-manager.html','https://rdwan.dev/projects/08-arabic-ui-components.html']:
            try:
              r=requests.get(u,headers=headers,timeout=25)
              soup=BeautifulSoup(r.text,'html.parser')
              def meta(name=None, prop=None):
                tag=soup.find('meta', attrs={'name':name}) if name else soup.find('meta', attrs={'property':prop})
                return tag.get('content') if tag else None
              can=soup.find('link',rel='canonical')
              jsonlds=[]
              types=[]
              errors=[]
              for s in soup.find_all('script',attrs={'type':'application/ld+json'}):
                try:
                  d=json.loads(s.string or s.get_text())
                  jsonlds.append(d)
                  def collect(x):
                    if isinstance(x,dict):
                      t=x.get('@type')
                      if isinstance(t,list): types.extend(t)
                      elif t: types.append(t)
                      for v in x.values(): collect(v)
                    elif isinstance(x,list):
                      for v in x: collect(v)
                  collect(d)
                except Exception as e: errors.append(str(e))
              data={
                'url':u,
                'status':r.status_code,
                'title': soup.title.string.strip() if soup.title and soup.title.string else None,
                'description':meta(name='description'),
                'robots':meta(name='robots'),
                'canonical':can.get('href') if can else None,
                'og:title':meta(prop='og:title'),
                'og:description':meta(prop='og:description'),
                'og:url':meta(prop='og:url'),
                'og:image':meta(prop='og:image'),
                'twitter:card':meta(name='twitter:card'),
                'twitter:title':meta(name='twitter:title'),
                'twitter:image':meta(name='twitter:image'),
                'jsonld_blocks':len(jsonlds),
                'schema_types':sorted(set(types)),
                'jsonld_errors':errors,
              }
              print(json.dumps(data,ensure_ascii=False))
            except Exception as e:
              print(json.dumps({'url':u,'error':str(e)},ensure_ascii=False))

          print('\n=== PAGESPEED INSIGHTS ===')
          endpoint='https://www.googleapis.com/pagespeedonline/v5/runPagespeed'
          for strategy in ['mobile','desktop']:
            params=[('url','https://rdwan.dev/'),('strategy',strategy),('category','performance'),('category','seo'),('category','accessibility'),('category','best-practices')]
            try:
              r=requests.get(endpoint,params=params,headers=headers,timeout=120)
              print('PSI_HTTP',strategy,r.status_code)
              if r.ok:
                j=r.json(); lr=j.get('lighthouseResult',{}); cats=lr.get('categories',{}); audits=lr.get('audits',{})
                out={'strategy':strategy,'finalUrl':lr.get('finalUrl'),'scores':{k:round((v.get('score') or 0)*100) for k,v in cats.items()}}
                for key in ['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','speed-index','total-blocking-time','interactive']:
                  a=audits.get(key,{})
                  out[key]={'display':a.get('displayValue'),'score':a.get('score')}
                opp=[]
                for k,a in audits.items():
                  det=a.get('details') or {}
                  sav=det.get('overallSavingsMs') or 0
                  if sav and sav>100:
                    opp.append((sav,k,a.get('title')))
                out['top_savings']=[{'ms':round(x[0]),'id':x[1],'title':x[2]} for x in sorted(opp,reverse=True)[:8]]
                print(json.dumps(out,ensure_ascii=False))
              else:
                print(r.text[:1200])
            except Exception as e:
              print('PSI_ERROR',strategy,str(e))
          PY
