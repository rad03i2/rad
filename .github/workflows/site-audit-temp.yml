name: Final live SEO performance audit v3

on:
  push:
    paths:
      - '.github/workflows/site-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages deployment
        run: sleep 25
      - name: Install Lighthouse
        run: npm install --silent lighthouse@12 chrome-launcher@1 cheerio@1
      - name: Audit homepage
        shell: bash
        run: |
          npx lighthouse https://rdwan.dev/ --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=/tmp/lh.json --quiet || true
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/lh.json','utf8'));
          const c=r.categories,a=r.audits;
          console.log('FINAL_LIGHTHOUSE',JSON.stringify({performance:c.performance.score,accessibility:c.accessibility.score,bestPractices:c['best-practices'].score,seo:c.seo.score,fcp:a['first-contentful-paint'].numericValue,lcp:a['largest-contentful-paint'].numericValue,cls:a['cumulative-layout-shift'].numericValue,tbt:a['total-blocking-time'].numericValue,speedIndex:a['speed-index'].numericValue}));
          for(const id of Object.keys(a).filter(x=>/layout|lcp|render-block|font/i.test(x))){const x=a[id];if(x.score!==1||x.numericValue)console.log('DIAG',id,JSON.stringify({score:x.score,numericValue:x.numericValue,displayValue:x.displayValue,details:x.details?.items?.slice?.(0,5)}));}
          JS
      - name: Validate live structured data social metadata and font preloads
        shell: bash
        run: |
          node <<'JS'
          const cheerio=require('cheerio');
          const urls=[['home','https://rdwan.dev/'],['about','https://rdwan.dev/about-radwan-abdulhadi.html'],['projects','https://rdwan.dev/projects/'],['project','https://rdwan.dev/projects/01-smart-file-manager.html'],['blog','https://rdwan.dev/blog/'],['article','https://rdwan.dev/blog/smart-file-manager-csharp-winui3.html'],['notes','https://rdwan.dev/notes/'],['note','https://rdwan.dev/notes/duplicate-files-size-then-sha256.html']];
          const expected={home:['Person','WebSite','ProfilePage','ItemList'],about:['Person','ProfilePage'],projects:['Person','ItemList'],project:['Person','WebPage','SoftwareSourceCode','BreadcrumbList'],blog:['Person','CollectionPage'],article:['Person','TechArticle','BreadcrumbList'],notes:['Person','CollectionPage'],note:['Person','TechArticle']};
          (async()=>{
            for(const [name,url] of urls){
              const res=await fetch(url,{redirect:'follow'}); if(!res.ok) throw new Error(`${name} HTTP ${res.status}`);
              const html=await res.text(),$=cheerio.load(html); let types=[];
              $('script[type="application/ld+json"]').each((_,el)=>{const j=JSON.parse($(el).text());const arr=j['@graph']||[j];for(const x of arr){let t=x['@type'];if(Array.isArray(t))types.push(...t);else if(t)types.push(t)}});
              for(const t of expected[name]) if(!types.includes(t)) throw new Error(`${name} missing schema ${t}; got ${types.join(',')}`);
              const canonical=$('link[rel="canonical"]').attr('href')||''; if(!canonical.startsWith('https://rdwan.dev')) throw new Error(`${name} bad canonical ${canonical}`);
              const og=$('meta[property="og:image"]').attr('content')||'';
              if(name==='home'||name==='project'||name==='article'||name==='note'){
                if(!og.startsWith('https://rdwan.dev/')) throw new Error(`${name} missing/bad og:image ${og}`);
                if(!$('meta[name="twitter:card"]').attr('content')) throw new Error(`${name} missing twitter card`);
              }
              if(name==='home'){
                const pre=$('link[rel="preload"][as="font"]').map((_,e)=>$(e).attr('href')).get();
                for(const n of [1,2,3,4]) if(!pre.includes(`assets/fonts/cairo-${n}.woff2`)) throw new Error(`home missing cairo-${n} preload`);
                const personCount=types.filter(t=>t==='Person').length;
                if(personCount!==1) throw new Error(`home Person schema count ${personCount}`);
              }
              console.log('LIVE_META_OK',name,'schemas='+types.join('|'),'canonical='+canonical,'og='+og);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
