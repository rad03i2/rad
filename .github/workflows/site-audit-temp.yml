name: Lighthouse final verification temporary

on:
  push:
    paths:
      - '.github/workflows/site-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Lighthouse mobile and desktop
        shell: bash
        run: |
          npx --yes lighthouse@12.8.2 https://rdwan.dev/ --output=json --output-path=/tmp/mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          npx --yes lighthouse@12.8.2 https://rdwan.dev/ --preset=desktop --output=json --output-path=/tmp/desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          node <<'JS'
          const fs=require('fs');
          for (const mode of ['mobile','desktop']) {
            const j=JSON.parse(fs.readFileSync('/tmp/'+mode+'.json','utf8'));
            const c=j.categories,a=j.audits;
            console.log('LIGHTHOUSE',JSON.stringify({mode,scores:{performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:Math.round(c.seo.score*100)},metrics:{FCP:a['first-contentful-paint'].displayValue,LCP:a['largest-contentful-paint'].displayValue,CLS:a['cumulative-layout-shift'].displayValue,TBT:a['total-blocking-time'].displayValue,SpeedIndex:a['speed-index'].displayValue},transfer:a['total-byte-weight']?.displayValue,dom:a['dom-size']?.displayValue}));
            for (const id of ['crawlable-anchors','color-contrast','label-content-name-mismatch','layout-shifts','cls-culprits-insight','largest-contentful-paint-element']) {
              const x=a[id]; if(!x) continue;
              console.log('AUDIT_DETAIL',mode,id,'score=',x.score,'display=',x.displayValue||'');
              console.log(JSON.stringify((x.details?.items||[]).slice(0,12)));
            }
          }
          JS
