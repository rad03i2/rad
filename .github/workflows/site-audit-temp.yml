name: Lighthouse baseline temporary

on:
  push:
    paths:
      - '.github/workflows/site-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Lighthouse mobile and desktop
        shell: bash
        run: |
          google-chrome --version || true
          npx --yes lighthouse@12.8.2 https://rdwan.dev/ --output=json --output-path=/tmp/mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          npx --yes lighthouse@12.8.2 https://rdwan.dev/ --preset=desktop --output=json --output-path=/tmp/desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          node <<'JS'
          const fs=require('fs');
          for (const mode of ['mobile','desktop']) {
            const j=JSON.parse(fs.readFileSync('/tmp/'+mode+'.json','utf8'));
            const c=j.categories,a=j.audits;
            const out={mode,scores:{performance:Math.round(c.performance.score*100),accessibility:Math.round(c.accessibility.score*100),bestPractices:Math.round(c['best-practices'].score*100),seo:Math.round(c.seo.score*100)},metrics:{FCP:a['first-contentful-paint'].displayValue,LCP:a['largest-contentful-paint'].displayValue,CLS:a['cumulative-layout-shift'].displayValue,TBT:a['total-blocking-time'].displayValue,SpeedIndex:a['speed-index'].displayValue},transfer:a['total-byte-weight']?.displayValue,dom:a['dom-size']?.displayValue};
            console.log('LIGHTHOUSE',JSON.stringify(out));
            const fails=Object.entries(a).filter(([k,v])=>v.scoreDisplayMode==='numeric' && typeof v.score==='number' && v.score<0.9).sort((x,y)=>(x[1].score??1)-(y[1].score??1)).slice(0,15).map(([k,v])=>({id:k,score:v.score,title:v.title,display:v.displayValue}));
            console.log('LOW_AUDITS_'+mode.toUpperCase(),JSON.stringify(fails));
          }
          JS
