name: Measure dynamic hero extras temporary

on:
  push:
    paths:
      - '.github/workflows/site-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure rendered extras
        shell: bash
        run: |
          npm install --silent puppeteer-core@24
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,width,height] of [['desktop',1365,900],['mobile',412,915]]){
              const page=await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1});
              await page.goto('https://rdwan.dev/',{waitUntil:'networkidle0',timeout:120000});
              await new Promise(r=>setTimeout(r,1200));
              const m=await page.evaluate(()=>{
                const rect=s=>document.querySelector(s)?.getBoundingClientRect();
                const stats=rect('#enhStats'),tech=rect('.enh-tech-strip'),hero=rect('#home'),band=rect('.tech-band'),about=rect('#about');
                return {stats:stats&&{h:stats.height,top:stats.top,bottom:stats.bottom},tech:tech&&{h:tech.height,top:tech.top,bottom:tech.bottom},hero:hero&&{bottom:hero.bottom,h:hero.height},band:band&&{top:band.top,h:band.height},about:about&&{top:about.top},totalExtras:(stats?.height||0)+(tech?.height||0)};
              });
              console.log('MEASURE',name,JSON.stringify(m));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
