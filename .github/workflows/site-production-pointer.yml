name: Mikhbar Site Production Pointer

# Keep Appwrite deployments isolated from automation-only commits.
# Appwrite should use the `site-prod` branch as its production branch.
# This workflow advances `site-prod` only when a push to `main` contains
# files that can affect the public website. Automation state/docs/workflow-only
# commits are intentionally ignored so they do not create unnecessary deploys.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'automation/**'
      - '.github/**'
      - 'README.md'
      - 'SEO-SETUP.md'

permissions:
  contents: write

concurrency:
  group: mikhbar-site-production-pointer
  cancel-in-progress: true

jobs:
  sync-production-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Point site-prod to the current public-site commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/git/refs/heads/site-prod" \
            -f sha="${TARGET_SHA}" \
            -F force=true

      - name: Verify site-prod pointer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/site-prod" --jq '.object.sha')"
          if [ "${ACTUAL_SHA}" != "${TARGET_SHA}" ]; then
            echo "site-prod does not match the intended production commit" >&2
            echo "expected=${TARGET_SHA}" >&2
            echo "actual=${ACTUAL_SHA}" >&2
            exit 1
          fi
          echo "site-prod=${ACTUAL_SHA}"
