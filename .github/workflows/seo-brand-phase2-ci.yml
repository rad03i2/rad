name: Temporary Mikhbar Phase 2 SEO CI

on:
  push:
    branches:
      - seo/brand-search-phase-2-arabic-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate Python and JavaScript
        run: |
          python -m py_compile automation/forum/build_locale_pages.py cloudflare/mikhbar-site/build.py
          node --check forum/article/article.js
          node --check cloudflare/mikhbar-site/src/article.js
          node --check cloudflare/mikhbar-site/src/index.js
      - name: Regenerate locale pages
        run: python automation/forum/build_locale_pages.py
      - name: Verify generated Arabic brand query signals
        shell: bash
        run: |
          grep -Fq '<title>مِخبار (مخبار) — أخبار التقنية والذكاء الاصطناعي</title>' forum/ar/index.html
          grep -Fq 'مِخبار (Mikhbar، ويُكتب مخبار دون تشكيل)' forum/ar/index.html
          grep -Fq '"alternateName":["مِخبار","مخبار","MIKHBAR"]' forum/ar/index.html
          grep -Fq '<title>Mikhbar — Technology News, AI, Robotics &amp; Automation</title>' forum/en/index.html
      - name: Run forum automation tests
        run: python -m unittest discover -s automation/forum/tests -v
      - name: Build Cloudflare static assets
        run: python cloudflare/mikhbar-site/build.py
      - name: Audit deployed sitemap completeness
        run: python automation/forum/audit_deployed_sitemap.py
      - name: Verify deployable Arabic branded search output
        shell: bash
        run: |
          grep -Fq '<title>مِخبار (مخبار) — أخبار التقنية والذكاء الاصطناعي</title>' dist/mikhbar/ar/index.html
          grep -Fq 'مِخبار (Mikhbar، ويُكتب مخبار دون تشكيل)' dist/mikhbar/ar/index.html
          grep -Fq '"alternateName":["مِخبار","مخبار","MIKHBAR"]' dist/mikhbar/ar/index.html
          grep -Fq 'rel="canonical" href="https://mikhbar.website/ar/"' dist/mikhbar/ar/index.html
          grep -Fq 'hreflang="en" href="https://mikhbar.website/en/"' dist/mikhbar/ar/index.html
          if grep -q 'rdwan.dev' dist/mikhbar/ar/index.html; then
            echo 'Legacy identity leaked into Arabic homepage' >&2
            exit 1
          fi
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
