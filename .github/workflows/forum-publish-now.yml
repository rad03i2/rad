name: RDWAN Tech Immediate Publisher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-now:
    if: contains(github.event.head_commit.message, '[publish-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt

      - name: Publish prepared story immediately
        run: python automation/forum/publisher_scheduler.py

      - name: Rebuild forum and SEO
        run: |
          python automation/forum/build_locale_pages.py
          python automation/forum/seo_finalize.py
          python automation/seo/normalize_html.py

      - name: Commit immediate publication
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum sitemap.xml automation/forum/state/*.json
          git add -- ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "Immediate publication completed with no repository changes."
            exit 0
          fi
          git commit -m "RDWAN Tech: immediate publication"
          git pull --rebase origin main
          git push origin HEAD:main
