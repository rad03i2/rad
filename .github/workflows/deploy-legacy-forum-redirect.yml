name: Mikhbar Legacy Forum Redirect Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/legacy-forum-redirect/**'
      - '.github/workflows/deploy-legacy-forum-redirect.yml'

permissions:
  contents: read

concurrency:
  group: mikhbar-legacy-forum-redirect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test redirect mapping
        run: node cloudflare/legacy-forum-redirect/test.mjs

      - name: Validate Worker bundle
        working-directory: cloudflare/legacy-forum-redirect
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.toml

      - name: Deploy scoped legacy redirect
        working-directory: cloudflare/legacy-forum-redirect
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cloudflare credentials missing::Cannot deploy the legacy forum redirect."
            exit 1
          fi
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Verify permanent migration redirects
        shell: bash
        run: |
          assert_redirect() {
            url="$1"
            expected="$2"
            headers="$(mktemp)"
            curl -sS -D "$headers" -o /dev/null --retry 6 --retry-delay 2 --retry-all-errors "$url"
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$headers")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$headers")"
            migration="$(awk 'BEGIN{IGNORECASE=1} /^x-mikhbar-migration:/ {print; exit}' "$headers")"
            if [ "$status" != "308" ] || [ "$location" != "$expected" ] || [ -z "$migration" ]; then
              echo "Redirect verification failed for $url" >&2
              cat "$headers" >&2
              exit 1
            fi
          }

          assert_redirect "https://rdwan.dev/forum" "https://mikhbar.website/ar/"
          assert_redirect "https://rdwan.dev/forum/en/" "https://mikhbar.website/en/"
          assert_redirect "https://rdwan.dev/forum/ar/" "https://mikhbar.website/ar/"
          assert_redirect "https://www.rdwan.dev/forum/en/ai/example/" "https://mikhbar.website/en/ai/example/"

          root_headers="$(mktemp)"
          curl -sS -D "$root_headers" -o /dev/null --retry 3 --retry-delay 1 --retry-all-errors https://rdwan.dev/
          if grep -Eiq '^x-mikhbar-migration:' "$root_headers"; then
            echo "Personal rdwan.dev homepage was incorrectly captured by the Mikhbar redirect Worker." >&2
            cat "$root_headers" >&2
            exit 1
          fi
          if grep -Eiq '^location:[[:space:]]*https://mikhbar\.website' "$root_headers"; then
            echo "Personal rdwan.dev homepage unexpectedly redirects to Mikhbar." >&2
            cat "$root_headers" >&2
            exit 1
          fi

          lookalike_headers="$(mktemp)"
          curl -sS -D "$lookalike_headers" -o /dev/null --retry 3 --retry-delay 1 --retry-all-errors https://rdwan.dev/forumanything || true
          if grep -Eiq '^x-mikhbar-migration:' "$lookalike_headers"; then
            echo "Lookalike /forumanything path was incorrectly captured." >&2
            cat "$lookalike_headers" >&2
            exit 1
          fi

          echo "Mikhbar legacy forum migration redirect is live and scoped correctly."
