name: Adjust internal loader duration temporary

on:
  push:
    paths:
      - '.github/workflows/adjust-loader-duration-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shorten loader to about half a second total
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          js_path=Path('enhancements.js')
          js=js_path.read_text(encoding='utf-8')
          old="""      loader._hideTimer=setTimeout(()=>{\n        loader.classList.add('is-done');\n        loader._removeTimer=setTimeout(()=>loader.remove(),480);\n      },560);"""
          new="""      loader._hideTimer=setTimeout(()=>{\n        loader.classList.add('is-done');\n        loader._removeTimer=setTimeout(()=>loader.remove(),180);\n      },320);"""
          if old not in js:
              raise SystemExit('loader timing block not found')
          js=js.replace(old,new,1)
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('enhancements.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* INTERNAL-ACTION-LOADER-HALF-SECOND */'
          if marker not in css:
              css += "\n"+marker+"\n.enh-action-loader{transition:opacity .18s ease,visibility .18s ease}\n"
              css_path.write_text(css,encoding='utf-8')

          sw_path=Path('service-worker.js')
          if sw_path.exists():
              sw=sw_path.read_text(encoding='utf-8')
              sw=re.sub(r'rad-portfolio-v3\.\d+\.0','rad-portfolio-v3.7.0',sw)
              sw_path.write_text(sw,encoding='utf-8')
          PY
      - name: Commit timing change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancements.js enhancements.css service-worker.js
          git commit -m 'Shorten internal loader to half a second' || exit 0
          git push
