name: Temporary Mikhbar Phase 4 Rebase CI

on:
  push:
    branches:
      - seo/multilingual-trust-phase-4-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate Python and JavaScript
        run: |
          python -m py_compile automation/forum/build_locale_pages.py automation/forum/generate_pillar_pages.py automation/forum/generate_trust_pages.py automation/forum/audit_multilingual_trust.py automation/forum/indexes.py automation/forum/seo_finalize.py automation/forum/audit_deployed_sitemap.py
          node --check forum/article/article.js
          node --check cloudflare/mikhbar-site/src/article.js
          node --check cloudflare/mikhbar-site/src/index.js
      - name: Rebuild locale and SEO pages
        run: |
          python automation/forum/build_locale_pages.py
          python automation/forum/enhance_category_seo.py
          python automation/forum/generate_pillar_pages.py
          python automation/forum/generate_trust_pages.py
          python automation/forum/normalize_public_identity.py
      - name: Audit source SEO graph
        run: |
          python automation/forum/audit_topic_hubs.py
          python automation/forum/audit_pillar_pages.py
          python automation/forum/rebuild_indexes.py
          python automation/forum/audit_multilingual_trust.py
      - name: Run tests
        run: python -m unittest discover -s automation/forum/tests -v
      - name: Build Cloudflare output
        run: python cloudflare/mikhbar-site/build.py
      - name: Audit deployed indexability
        run: python automation/forum/audit_deployed_sitemap.py
      - name: Verify trust URLs and latest UI preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/mikhbar")
          errors = []
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          pairs = {
              "/about/": "/en/about/",
              "/contact/": "/en/contact/",
              "/editorial-policy/": "/en/editorial-policy/",
              "/corrections/": "/en/corrections/",
              "/ai-policy/": "/en/ai-policy/",
              "/authors/radwan-abdulhadi/": "/en/authors/radwan-abdulhadi/",
          }
          for ar, en in pairs.items():
              for path, locale in ((ar, "ar"), (en, "en")):
                  p = root / path.strip("/") / "index.html"
                  if not p.exists():
                      errors.append(f"missing {p}")
                      continue
                  text = p.read_text(encoding="utf-8")
                  canonical = f'https://mikhbar.website{path}'
                  if f'rel="canonical" href="{canonical}"' not in text:
                      errors.append(f"{path}: canonical mismatch")
                  if 'hreflang="ar"' not in text or 'hreflang="en"' not in text:
                      errors.append(f"{path}: missing hreflang pair")
                  if canonical not in sitemap:
                      errors.append(f"{path}: missing sitemap entry")
          ar_home = (root / "ar" / "index.html").read_text(encoding="utf-8")
          en_home = (root / "en" / "index.html").read_text(encoding="utf-8")
          for href in ("/about/", "/contact/", "/editorial-policy/", "/corrections/", "/ai-policy/"):
              if f'href="{href}"' not in ar_home:
                  errors.append(f"Arabic home missing {href}")
          for href in ("/en/about/", "/en/contact/", "/en/editorial-policy/", "/en/corrections/", "/en/ai-policy/"):
              if f'href="{href}"' not in en_home:
                  errors.append(f"English home missing {href}")
          if "rt-now-thumb" not in en_home or "20260929-layout4" not in en_home:
              errors.append("latest UI layout/image enhancements were lost")
          if "RDWAN Tech" in ar_home or "RDWAN Tech" in en_home:
              errors.append("legacy RDWAN Tech identity remains")
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              raise SystemExit(1)
          print("Phase 4 trust/entity/link-depth verification passed")
          PY
      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
