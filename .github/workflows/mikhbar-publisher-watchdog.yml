name: Mikhbar Publisher Watchdog

# Independent safety net for GitHub scheduled-event delays.
# It does not publish by itself; it only wakes the primary publisher when
# Mikhbar is overdue, and it refuses to stack duplicate publisher runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mikhbar-publisher-watchdog.yml'
      - 'automation/forum/publisher_wakeup.py'
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: mikhbar-publisher-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recover overdue publication clock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/forum/publisher_wakeup.py --trigger github-secondary-watchdog --minimum-age-minutes 19
