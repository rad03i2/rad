name: Mikhbar Publisher Watchdog

# Independent safety net for GitHub scheduled-event delays.
# It does not publish by itself; it only wakes the primary publisher when
# Mikhbar is overdue, and it refuses to stack duplicate publisher runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: mikhbar-publisher-secondary-watchdog
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recover overdue publication clock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          history_path = Path("automation/forum/state/published.json")
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {}
          raw = history.get("last_published_at")

          if raw:
              last = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - last.astimezone(timezone.utc)).total_seconds() / 60
              if age_minutes < 19:
                  print(f"Mikhbar is healthy: latest story age={age_minutes:.1f} minutes.")
                  raise SystemExit(0)
          else:
              age_minutes = None

          repository = os.environ["GITHUB_REPOSITORY"]
          response = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{repository}/actions/workflows/forum-collector.yml/runs",
                  "-f", "per_page=20",
              ],
              capture_output=True,
              text=True,
              check=True,
              env=os.environ,
          )
          runs = json.loads(response.stdout or "{}").get("workflow_runs", [])
          active = [
              run for run in runs
              if run.get("status") in {"queued", "in_progress", "waiting", "pending"}
          ]
          if active:
              print(f"Publisher recovery not needed: active run found ({active[0].get('status')}).")
              raise SystemExit(0)

          endpoint = f"repos/{repository}/actions/workflows/forum-collector.yml/dispatches"
          body = '{"ref":"main","inputs":{"trigger":"github-secondary-watchdog"}}'
          subprocess.run(
              ["gh", "api", "--method", "POST", endpoint, "--input", "-"],
              input=body,
              text=True,
              check=True,
              env=os.environ,
          )
          if age_minutes is None:
              print("Mikhbar publication history missing; recovery publisher dispatched.")
          else:
              print(f"Mikhbar overdue by publisher-clock policy (age={age_minutes:.1f}m); recovery publisher dispatched.")
          PY
