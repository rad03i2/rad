name: Tweak hero social placement

on:
  push:
    paths:
      - '.github/workflows/tweak-hero.yml'

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move socials and slightly shrink portrait
        shell: python
        run: |
          from pathlib import Path

          script = Path('script.js')
          s = script.read_text(encoding='utf-8')
          s = s.replace("heroActions.insertAdjacentElement('afterend', socials);", "heroActions.insertBefore(socials, heroActions.children[1] || null);")
          s = s.replace(".hero-socials{display:flex;align-items:center;gap:10px;margin-top:14px;direction:ltr}", ".hero-socials{display:flex;align-items:center;gap:7px;margin:0 2px;direction:ltr;flex:0 0 auto}")
          s = s.replace(".hero-socials a{width:36px;height:36px;", ".hero-socials a{width:30px;height:30px;")
          s = s.replace(".hero-socials svg{width:17px;height:17px;display:block}", ".hero-socials svg{width:15px;height:15px;display:block}")
          s = s.replace("@media(max-width:760px){.hero-socials{margin-top:12px}.hero-socials a{width:34px;height:34px}.hero-socials svg{width:16px;height:16px}}", "@media(max-width:760px){.hero-socials{gap:6px;margin:0 1px}.hero-socials a{width:29px;height:29px}.hero-socials svg{width:14px;height:14px}}")
          script.write_text(s, encoding='utf-8')

          css = Path('projects.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('width:min(100%,455px)!important', 'width:min(100%,448px)!important')
          c = c.replace('max-width:470px!important', 'max-width:462px!important')
          c = c.replace('width:min(100%,430px)!important', 'width:min(100%,423px)!important')
          c = c.replace('width:min(100% - 28px,385px)!important', 'width:min(100% - 28px,380px)!important')
          css.write_text(c, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js projects.css
          git diff --cached --quiet || git commit -m "Refine hero socials placement and portrait size"
          git push
