name: Temporary Brand Consolidation CI

on:
  push:
    branches:
      - seo/brand-entity-consolidation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test legacy redirect mapping
        run: node cloudflare/legacy-forum-redirect/test.mjs
      - name: Validate Cloudflare route configuration
        working-directory: cloudflare/legacy-forum-redirect
        run: |
          grep -Fq 'pattern = "rdwan.dev/forum*"' wrangler.toml
          grep -Fq 'pattern = "www.rdwan.dev/forum*"' wrangler.toml
          npx --yes wrangler@latest deploy --dry-run --config wrangler.toml
