name: Temporary Semantic Internal Linking CI

on:
  push:
    branches:
      - seo/semantic-internal-linking

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate code
        run: |
          python -m py_compile automation/forum/publisher.py automation/forum/rebuild_indexes.py
          node --check cloudflare/mikhbar-site/src/index.js
          node --check cloudflare/mikhbar-site/scripts/audit-semantic-links.mjs
      - name: Run semantic unit tests
        run: node --test cloudflare/mikhbar-site/tests/*.test.mjs
      - name: Reproduce SEO deployment sequence
        run: |
          python automation/forum/enhance_category_seo.py
          python automation/forum/generate_pillar_pages.py
          python automation/forum/generate_archive_pages.py
          python automation/forum/generate_trust_pages.py
          python automation/forum/rebuild_indexes.py
          python automation/forum/audit_multilingual_trust.py
          node cloudflare/mikhbar-site/scripts/audit-semantic-links.mjs
          python automation/forum/audit_crawl_graph.py
      - name: Validate enriched semantic indexes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for locale in ("ar", "en"):
              payload = json.loads(Path(f"forum/posts-{locale}.json").read_text(encoding="utf-8"))
              posts = payload.get("posts", [])
              content_backed = [p for p in posts if p.get("contentFile")]
              entity_backed = [p for p in content_backed if p.get("entities")]
              tag_backed = [p for p in content_backed if p.get("tags")]
              print(locale, "content_backed", len(content_backed), "entities", len(entity_backed), "tags", len(tag_backed))
              assert content_backed
              assert entity_backed
              assert tag_backed
          PY
      - name: Build and validate Worker
        run: |
          python cloudflare/mikhbar-site/build.py
          python automation/forum/audit_deployed_sitemap.py
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
