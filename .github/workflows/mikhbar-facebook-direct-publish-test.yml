name: Mikhbar Facebook Direct Publish Test

on:
  push:
    paths:
      - 'automation/social/facebook_direct_publish_trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facebook-publish:
    runs-on: ubuntu-latest
    env:
      FACEBOOK_PAGE_ID: \${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: \${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish latest Mikhbar article directly to Facebook
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          page_id = os.environ['FACEBOOK_PAGE_ID']
          page_token = os.environ['FACEBOOK_PAGE_ACCESS_TOKEN']
          root = Path('.')
          history = json.loads((root / 'automation/forum/state/published.json').read_text(encoding='utf-8'))
          item = history['items'][0]
          article = json.loads((root / item['content_file']).read_text(encoding='utf-8'))
          ar = article.get('locales', {}).get('ar', {})
          title = ar.get('title') or item.get('title') or 'خبر جديد'
          description = ar.get('description') or ar.get('deck') or ''
          path = article.get('urls', {}).get('ar') or item.get('published_url')
          link = 'https://rdwan.dev' + path if str(path).startswith('/') else str(path)
          link += ('&' if '?' in link else '?') + 'utm_source=facebook&utm_medium=social&utm_campaign=mikhbar_social'
          message = f'{title}\\n\\n{description}\\n\\nاقرأ التفاصيل على مِخبار:\\n{link}\\n\\n#مخبار'
          endpoint = f'https://graph.facebook.com/{page_id}/feed'
          data = urlencode({'message': message, 'link': link}).encode()
          req = Request(endpoint, data=data, method='POST', headers={'Authorization': 'Bearer ' + page_token})
          with urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode())
          print(json.dumps({'status':'published','page_id':page_id,'page_name':'مِخبار','post_id':result.get('id'),'story_id':item.get('story_id')}, ensure_ascii=False))
          PY
