name: UI refinement temp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ui-refinement-temp.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply portfolio refinements
        run: python3 .github/ui_refine.py

      - name: Verify JavaScript
        run: node --check enhancements.js

      - name: Verify requested changes
        run: |
          grep -Fq "opacity:.38" styles.css
          grep -Fq "programmingIconTicker" index.html
          grep -Fq "const techIcons" enhancements.js
          grep -Fq "hydrateTechIconTicker" enhancements.js
          ! grep -Fq "addProcess,addToolsAreasTimeline" enhancements.js
          grep -Fq "programming-icon-ticker-v1" enhancements.css
          grep -Fq "rad-portfolio-v3.11.0" service-worker.js

      - name: Commit portfolio refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css enhancements.js enhancements.css service-worker.js
          git diff --cached --check
          git commit -m "Refine code background and icon technology ticker"
          git push origin main
