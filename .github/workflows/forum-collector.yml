name: RDWAN Tech 20-Minute Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '3,23,43 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-collector.yml'

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: rdwan-tech-20-minute-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Select trend, write and publish one article
        run: python automation/forum/publisher.py

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdwan-tech-20min-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication and state
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "No repository changes in this 20-minute cycle."
            exit 0
          fi
          git commit -m "RDWAN Tech: 20-minute automated publication"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Notify IndexNow directly
        if: success()
        shell: bash
        env:
          SITE_URL: https://rdwan.dev
          INDEXNOW_KEY: ff7de3f199bfcac8fda652aec7caabcd
        run: |
          python - <<'PY' > /tmp/indexnow.json
          import xml.etree.ElementTree as ET, json, os
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[]
          for path in ('sitemap.xml','forum/sitemap.xml'):
              try:
                  root=ET.parse(path).getroot()
                  urls.extend(x.text for x in root.findall('.//s:loc',ns) if x.text)
              except Exception:
                  pass
          urls=list(dict.fromkeys(urls))
          site=os.environ['SITE_URL'].rstrip('/')
          host=site.split('://',1)[1].split('/')[0]
          print(json.dumps({
            'host':host,
            'key':os.environ['INDEXNOW_KEY'],
            'keyLocation':site+'/'+os.environ['INDEXNOW_KEY']+'.txt',
            'urlList':urls[:10000]
          }))
          PY
          sleep 20
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            || echo "IndexNow notification was not accepted this run; publication remains committed."
