name: RDWAN Tech Hourly Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-collector.yml'

permissions:
  contents: write
  models: read

concurrency:
  group: rdwan-tech-hourly-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Select trend, write and publish one article
        run: python automation/forum/publisher.py

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdwan-tech-hourly-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication and state
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "No publishable change this hour."
            exit 0
          fi
          git commit -m "RDWAN Tech: hourly automated publication"
          git pull --rebase origin main
          git push origin HEAD:main
