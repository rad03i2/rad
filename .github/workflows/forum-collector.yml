name: RDWAN Tech Collector — Dry Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-collector.yml'

permissions:
  contents: write

concurrency:
  group: rdwan-tech-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout safe automation branch
        uses: actions/checkout@v4
        with:
          ref: forum-automation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate stories
        run: python automation/forum/run.py --dry-run

      - name: Upload review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rdwan-tech-collector-${{ github.run_number }}
          path: |
            automation/forum/state/queue.json
            automation/forum/state/candidates.json
            automation/forum/state/run_report.json
          retention-days: 7

      - name: Persist collector state to forum-automation branch
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "automation: update RDWAN Tech collector state"
          git push origin HEAD:forum-automation
