name: RDWAN Tech Hourly Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-collector.yml'

concurrency:
  group: rdwan-tech-hourly-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
      copilot-requests: write
    outputs:
      published: ${{ steps.publication_status.outputs.published }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Select trend, write and publish one article
        run: python automation/forum/publisher.py

      - name: Detect publication result
        id: publication_status
        shell: bash
        run: |
          STATUS=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('automation/forum/state/publisher_report.json')
          try:
              print(json.loads(p.read_text(encoding='utf-8')).get('status',''))
          except Exception:
              print('')
          PY
          )
          if [ "$STATUS" = "published" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publisher status: $STATUS"

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdwan-tech-hourly-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication and state
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "No repository changes this hour."
            exit 0
          fi
          git commit -m "RDWAN Tech: hourly automated publication"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy latest RDWAN Tech publication
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    needs: [publish, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Submit site and forum URLs to IndexNow
        shell: bash
        env:
          SITE_URL: https://rdwan.dev
          INDEXNOW_KEY: ff7de3f199bfcac8fda652aec7caabcd
        run: |
          if ! curl -fsS --max-time 15 "$SITE_URL/" >/dev/null; then
            echo "Public custom domain is not reachable; skipping IndexNow without failing."
            exit 0
          fi
          python - <<'PY' > /tmp/indexnow.json
          import xml.etree.ElementTree as ET, json, os
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[]
          for path in ('sitemap.xml','forum/sitemap.xml'):
              try:
                  root=ET.parse(path).getroot()
                  urls.extend(x.text for x in root.findall('.//s:loc',ns) if x.text)
              except Exception:
                  pass
          urls=list(dict.fromkeys(urls))
          site=os.environ['SITE_URL'].rstrip('/')
          host=site.split('://',1)[1].split('/')[0]
          print(json.dumps({
            'host':host,
            'key':os.environ['INDEXNOW_KEY'],
            'keyLocation':site+'/'+os.environ['INDEXNOW_KEY']+'.txt',
            'urlList':urls[:10000]
          }))
          PY
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json
          echo "IndexNow submission sent for RDWAN Tech."
