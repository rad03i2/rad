name: RDWAN Tech 20-Minute Publisher
# Runs as a 5-minute watchdog. The publisher itself enforces a 20-minute gap,
# so a delayed/missed GitHub schedule gets another chance within about 5 minutes.
# Offset away from minute 00 to reduce GitHub Actions schedule congestion.

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-collector.yml'

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: rdwan-tech-publication-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Publish if 20-minute gap is due
        run: python automation/forum/publisher.py

      - name: Build crawlable Arabic and English forum hubs
        run: python automation/forum/build_locale_pages.py

      - name: Finalize SEO indexability
        run: python automation/forum/seo_finalize.py

      - name: Normalize canonical host across HTML
        run: python automation/seo/normalize_html.py

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdwan-tech-watchdog-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication and state
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum sitemap.xml automation/forum/state/*.json
          git add -- ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "Watchdog check completed; no publication was due in this cycle."
            exit 0
          fi
          git commit -m "RDWAN Tech: automated 20-minute publication watchdog"
          git pull --rebase origin main
          git push origin HEAD:main
