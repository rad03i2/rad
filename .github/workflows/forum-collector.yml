name: Mikhbar 20-Minute Publisher
# Primary publication clock. The next story is prepared during the preceding
# 20-minute gap, so this run should publish a ready, quality-approved draft
# instead of starting research and writing only after the gap expires.

on:
  workflow_dispatch:
  schedule:
    - cron: '0,20,40 * * * *'

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: mikhbar-publication-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Prepare during cooldown or publish ready story
        run: python automation/forum/publisher_scheduler.py

      - name: Rebuild all published article pages with current branding
        run: python automation/forum/rebuild_articles.py

      - name: Build crawlable Arabic and English forum hubs
        run: python automation/forum/build_locale_pages.py

      - name: Finalize SEO indexability
        run: python automation/forum/seo_finalize.py

      - name: Normalize canonical host across HTML
        run: python automation/seo/normalize_html.py

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikhbar-primary-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/prepared_article.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication and preparation state
        shell: bash
        run: |
          git config user.name "Mikhbar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum sitemap.xml automation/forum/state/*.json
          git add -- ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "Primary 20-minute cycle completed; no repository changes were required."
            exit 0
          fi
          git commit -m "Mikhbar: automated 20-minute publication cycle"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Repository update pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another main update; retrying safely (attempt ${attempt}/4)."
            sleep $((attempt * 3))
          done
          echo "Unable to push after 4 safe rebase retries."
          exit 1
