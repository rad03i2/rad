name: Mikhbar 20-Minute Publisher
# Primary publication clock. Articles are stored as structured JSON data.
# Per-article HTML rendering is intentionally disabled in data-only mode.

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Explicit manual/external trigger marker"
        required: true
        type: string
  push:
    paths:
      - 'automation/forum/state/force_publish_once.json'
  schedule:
    - cron: '2,22,42 * * * *'

permissions:
  contents: write
  actions: write
  copilot-requests: write

concurrency:
  group: mikhbar-publication-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Prepare or publish structured article data
        run: python automation/forum/data_only_scheduler.py

      - name: Build dynamic article route map
        run: python automation/forum/build_article_map.py

      - name: Reject covered legacy article HTML
        run: python automation/forum/prune_legacy_article_html.py --check-clean

      - name: Build lightweight Arabic and English hubs
        run: python automation/forum/build_locale_pages.py

      - name: Enhance search topic hubs
        run: python automation/forum/enhance_category_seo.py

      - name: Generate evergreen Mikhbar pillar guides
        run: python automation/forum/generate_pillar_pages.py

      - name: Normalize Mikhbar public SEO identity
        run: python automation/forum/normalize_public_identity.py

      - name: Audit Mikhbar topic hubs
        run: python automation/forum/audit_topic_hubs.py

      - name: Audit Mikhbar pillar guides
        run: python automation/forum/audit_pillar_pages.py

      - name: Upload publisher audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikhbar-primary-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/prepared_article.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication data and lightweight indexes
        id: publication_commit
        shell: bash
        run: |
          git config user.name "Mikhbar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Primary 20-minute cycle completed; no repository changes were required."
            exit 0
          fi
          git commit -m "Mikhbar: publish structured article data"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Repository update pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another main update; retrying safely (attempt ${attempt}/4)."
            sleep $((attempt * 3))
          done
          echo "Unable to push after 4 safe rebase retries."
          exit 1

      - name: Dispatch production deploy and IndexNow
        if: steps.publication_commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-mikhbar-cloudflare.yml --ref main -f target=production
          gh workflow run indexnow.yml --ref main
          echo "Dispatched Cloudflare production deploy and IndexNow for the new publication commit."
