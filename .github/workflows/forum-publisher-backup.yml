name: Mikhbar Backup Publisher
# Preparation/recovery watchdog for the data-only publication pipeline.
# It prepares and publishes structured article data without generating per-story HTML.

on:
  workflow_dispatch:
  schedule:
    - cron: '8,13,18,28,33,38,48,53,58 * * * *'

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: mikhbar-publication-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
          npm install -g @github/copilot

      - name: Run pipeline tests
        run: python -m unittest discover -s automation/forum/tests -v

      - name: Collect and evaluate fresh stories
        run: python automation/forum/run.py

      - name: Prepare or recover structured article data
        run: python automation/forum/data_only_scheduler.py

      - name: Build dynamic article route map
        run: python automation/forum/build_article_map.py

      - name: Build lightweight Arabic and English hubs
        run: python automation/forum/build_locale_pages.py

      - name: Enhance search topic hubs
        run: python automation/forum/enhance_category_seo.py

      - name: Normalize Mikhbar public SEO identity
        run: python automation/forum/normalize_public_identity.py

      - name: Upload backup audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikhbar-backup-${{ github.run_number }}
          path: |
            automation/forum/state/run_report.json
            automation/forum/state/publisher_report.json
            automation/forum/state/prepared_article.json
            automation/forum/state/candidates.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit publication data and preparation state
        shell: bash
        run: |
          git config user.name "Mikhbar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum automation/forum/state/*.json
          if git diff --cached --quiet; then
            echo "Backup preparation/recovery cycle completed; no repository changes were required."
            exit 0
          fi
          git commit -m "Mikhbar: prepare or recover structured article data"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Repository update pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push raced with another main update; retrying safely (attempt ${attempt}/4)."
            sleep $((attempt * 3))
          done
          echo "Unable to push after 4 safe rebase retries."
          exit 1