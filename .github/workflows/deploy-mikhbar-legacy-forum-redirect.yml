name: Mikhbar Legacy Forum Redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/legacy-forum-redirect/**'
      - '.github/workflows/deploy-mikhbar-legacy-forum-redirect.yml'

permissions:
  contents: read

concurrency:
  group: mikhbar-legacy-forum-redirect
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate redirect worker syntax
        run: node --check cloudflare/legacy-forum-redirect/src/index.js

      - name: Test isolated URL mapping
        run: node cloudflare/legacy-forum-redirect/test.mjs

      - name: Deploy only the legacy /forum migration route
        working-directory: cloudflare/legacy-forum-redirect
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cloudflare credentials missing::Legacy redirect was tested but not deployed."
            exit 1
          fi
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Verify live legacy redirects
        shell: bash
        run: |
          check_redirect() {
            source_url="$1"
            expected_location="$2"
            headers_file="$(mktemp)"
            status="$(curl -sS -o /dev/null -D "$headers_file" -w '%{http_code}' "$source_url")"
            if [ "$status" != "308" ]; then
              echo "::error::Expected 308 for $source_url but received $status"
              cat "$headers_file"
              exit 1
            fi
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers_file")"
            if [ "$location" != "$expected_location" ]; then
              echo "::error::Unexpected redirect for $source_url: $location"
              cat "$headers_file"
              exit 1
            fi
            grep -Eiq '^x-mikhbar-migration:[[:space:]]*legacy-forum' "$headers_file"
          }

          check_redirect "https://rdwan.dev/forum/" "https://mikhbar.website/ar/"
          check_redirect "https://rdwan.dev/forum/en/" "https://mikhbar.website/en/"
          check_redirect "https://rdwan.dev/forum/about/" "https://mikhbar.website/about/"

          root_status="$(curl -sS -o /dev/null -w '%{http_code}' https://rdwan.dev/)"
          if [ "$root_status" = "308" ]; then
            echo "::error::rdwan.dev homepage must not be captured by the Mikhbar migration Worker."
            exit 1
          fi
