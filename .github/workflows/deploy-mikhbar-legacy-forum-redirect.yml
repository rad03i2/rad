name: Mikhbar Legacy Forum Redirect Reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate redirect mapping reference
        run: |
          node --check cloudflare/legacy-forum-redirect/src/index.js
          node cloudflare/legacy-forum-redirect/test.mjs

      - name: Explain production ownership
        run: |
          echo "rdwan.dev is hosted by Appwrite Sites, not by the Cloudflare zone used for mikhbar.website."
          echo "Production legacy /forum migration pages are maintained in rad03i2/rad2."
          echo "This Worker remains only as a tested reference in case rdwan.dev is moved behind Cloudflare later."
