name: Optimize homepage temporary

on:
  push:
    paths:
      - '.github/workflows/optimize-index-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract embedded portrait and optimize homepage
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          import re,base64,io
          from PIL import Image

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          matches=list(re.finditer(r'data:image/(png|jpeg|jpg|webp);base64,([A-Za-z0-9+/=\r\n]+)',text))
          if not matches:
              print('No embedded image data URI found; leaving portrait unchanged.')
              image_path='assets/images/radwan-profile.webp'
          else:
              m=max(matches,key=lambda x: len(x.group(2)))
              mime=m.group(1)
              raw=base64.b64decode(re.sub(r'\s+','',m.group(2)))
              print('Largest embedded image bytes:',len(raw),'mime:',mime)
              img=Image.open(io.BytesIO(raw))
              out=Path('assets/images/radwan-profile.webp')
              out.parent.mkdir(parents=True,exist_ok=True)
              buf=io.BytesIO()
              img.save(buf,'WEBP',lossless=True,method=6)
              webp=buf.getvalue()
              if len(webp)<len(raw):
                  out.write_bytes(webp)
                  image_path=str(out).replace('\\','/')
                  print('Using lossless WebP:',len(webp),'bytes')
              else:
                  ext='jpg' if mime in ('jpg','jpeg') else mime
                  out=Path(f'assets/images/radwan-profile.{ext}')
                  out.write_bytes(raw)
                  image_path=str(out).replace('\\','/')
                  print('Keeping original encoded bytes:',len(raw),'bytes')
              uri=m.group(0)
              text=text.replace(uri,image_path,1)

          preload=f'<link rel="preload" as="image" href="{image_path}" fetchpriority="high">'
          if preload not in text:
              text=text.replace('</head>',preload+'\n</head>',1)

          redirect="<script id=\"canonical-host-redirect\">if(location.hostname==='www.rdwan.dev'){location.replace('https://rdwan.dev'+location.pathname+location.search+location.hash)}</script>"
          if 'canonical-host-redirect' not in text:
              text=text.replace('</head>',redirect+'\n</head>',1)

          if 'href="blog/"' not in text and 'seo-discovery-links' in text:
              text=text.replace('<a href="feed.xml">RSS</a>','<a href="blog/">مقالات تقنية</a><a href="notes/">ملاحظات تقنية</a><a href="feed.xml">RSS</a>')

          p.write_text(text,encoding='utf-8')
          print('index.html bytes after:',p.stat().st_size)
          PY
      - name: Commit optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/radwan-profile.*
          git commit -m 'Optimize homepage payload without visual changes' || exit 0
          git push
