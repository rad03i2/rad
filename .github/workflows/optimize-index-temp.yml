name: Final font delivery optimization temporary

on:
  push:
    paths:
      - '.github/workflows/optimize-index-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preload local Cairo fonts and remove duplicate Person schema
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          marker='<link rel="preload" href="assets/images/radwan-profile.webp" as="image" type="image/webp" fetchpriority="high">'
          preloads='\n'.join([
            '<link rel="preload" href="assets/fonts/cairo-1.woff2" as="font" type="font/woff2" crossorigin>',
            '<link rel="preload" href="assets/fonts/cairo-2.woff2" as="font" type="font/woff2" crossorigin>',
            '<link rel="preload" href="assets/fonts/cairo-3.woff2" as="font" type="font/woff2" crossorigin>',
            '<link rel="preload" href="assets/fonts/cairo-4.woff2" as="font" type="font/woff2" crossorigin>'
          ])
          # Remove older individual font preload(s), then add one canonical preload block.
          h=re.sub(r'\s*<link rel="preload" href="assets/fonts/cairo-[1-4]\.woff2" as="font" type="font/woff2" crossorigin>','',h)
          if marker in h:
              h=h.replace(marker, marker+'\n  '+preloads.replace('\n','\n  '),1)
          else:
              raise SystemExit('hero image preload marker not found')

          # Keep only the richer SEO-V4 Person graph; remove the earlier minimal duplicate Person JSON-LD.
          h=re.sub(r'<script type="application/ld\+json">\{"@context":"https://schema.org","@type":"Person","name":"Radwan Abdulhadi".*?</script>\s*','',h,count=1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8')
              s=re.sub(r'rad-portfolio-v3\.\d+\.0','rad-portfolio-v3.3.0',s)
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit final font optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Preload Cairo fonts and consolidate Person schema' || exit 0
          git push
