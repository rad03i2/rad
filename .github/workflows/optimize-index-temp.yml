name: Final layout stability optimization temporary

on:
  push:
    paths:
      - '.github/workflows/optimize-index-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stabilize font and dynamic hero content
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          cssp=Path('styles.css')
          css=cssp.read_text(encoding='utf-8').replace("format('truetype')","format('woff2')")
          cssp.write_text(css,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          fontpre='<link rel="preload" href="assets/fonts/cairo-4.woff2" as="font" type="font/woff2" crossorigin>'
          if fontpre not in h:
              marker='<link rel="preload" href="assets/images/radwan-profile.webp" as="image" type="image/webp" fetchpriority="high">'
              h=h.replace(marker,marker+'\n  '+fontpre,1)

          # Render stats/ticker in initial HTML so JS enhancement no longer inserts them after first paint.
          if 'id="enhStats"' not in h:
              start=h.find('<section',h.find('<main'))
              home=h.find('id="home"',start)
              if home==-1: raise SystemExit('home section not found')
              sec_start=h.rfind('<section',start,home+1)
              pos=home
              depth=0
              token=re.compile(r'<section\b|</section>')
              end=None
              for m in token.finditer(h,sec_start):
                  if m.group(0).startswith('<section'): depth+=1
                  else:
                      depth-=1
                      if depth==0:
                          end=m.end(); break
              if end is None: raise SystemExit('home section end not found')
              block='''\n<section id="enhStats" class="enh-shell enh-reveal"><div class="enh-stats"><div class="enh-stat"><strong data-count="20">0</strong><span>مشروعًا معروضًا</span></div><div class="enh-stat"><strong>Web</strong><span>واجهات ومواقع ويب</span></div><div class="enh-stat"><strong>Desktop</strong><span>أدوات وتطبيقات حاسوب</span></div><div class="enh-stat"><strong>Automation</strong><span>أتمتة وسير عمل</span></div></div></section>\n<div class="enh-tech-strip enh-reveal"><div class="enh-tech-track">''' + ''.join(f'<span class="enh-tech-chip">{x}</span>' for x in ['Python','C#','.NET','JavaScript','HTML','CSS','Git','GitHub','PowerShell','C++','SQL','Android','Kotlin','PHP','Automation','IoT']*2) + '''</div></div>\n'''
              h=h[:end]+block+h[end:]
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8').replace('rad-portfolio-v3.1.0','rad-portfolio-v3.2.0')
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit stability optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html service-worker.js
          git commit -m 'Preload hero font and render hero extras statically' || exit 0
          git push
