name: Critical CSS and portrait optimization temporary

on:
  push:
    paths:
      - '.github/workflows/optimize-index-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Make project CSS render-blocking and optimize hero portrait
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,re

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          project_link='<link rel="stylesheet" href="projects.css">'
          if project_link not in h:
              marker='<link rel="stylesheet" href="enhancements.css">'
              if marker not in h: raise SystemExit('enhancements css marker not found')
              h=h.replace(marker,marker+'\n'+project_link,1)

          # Keep the intrinsic ratio and update metadata to the optimized physical image size.
          h=h.replace('width="1200" height="1055" fetchpriority="high" decoding="sync" alt="صورة رضوان عبدالهادي"','width="960" height="844" fetchpriority="high" decoding="sync" alt="صورة رضوان عبدالهادي"')
          idx.write_text(h,encoding='utf-8')

          imgp=Path('assets/images/radwan-profile.webp')
          original=imgp.read_bytes()
          im=Image.open(io.BytesIO(original)).convert('RGB')
          if im.width>960:
              new_h=round(im.height*960/im.width)
              im=im.resize((960,new_h),Image.Resampling.LANCZOS)
          buf=io.BytesIO()
          im.save(buf,'WEBP',quality=82,method=6)
          optimized=buf.getvalue()
          print('portrait_before',len(original),'portrait_after',len(optimized),'size',im.size)
          if len(optimized)<len(original): imgp.write_bytes(optimized)

          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8')
              s=re.sub(r'rad-portfolio-v3\.\d+\.0','rad-portfolio-v3.5.0',s)
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit critical CSS and image optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/radwan-profile.webp service-worker.js
          git commit -m 'Load hero layout CSS early and optimize portrait image' || exit 0
          git push
