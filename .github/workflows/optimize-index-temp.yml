name: Accessibility tuning temporary

on:
  push:
    paths:
      - '.github/workflows/optimize-index-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix accessible names and contrast without changing layout
        run: |
          python <<'PY'
          from pathlib import Path

          js=Path('enhancements.js')
          text=js.read_text(encoding='utf-8')
          marker='/* ACCESSIBILITY-FINAL */'
          if marker not in text:
              text += '''\n/* ACCESSIBILITY-FINAL */\n(function(){\n  const fixAccessibleNames=()=>{\n    const brand=document.querySelector('a.brand');\n    if(brand) brand.removeAttribute('aria-label');\n    document.querySelectorAll('.showcase-image-link[aria-label]').forEach(a=>a.removeAttribute('aria-label'));\n  };\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fixAccessibleNames,{once:true});\n  else fixAccessibleNames();\n  const observer=new MutationObserver(fixAccessibleNames);\n  observer.observe(document.documentElement,{childList:true,subtree:true});\n  setTimeout(()=>observer.disconnect(),5000);\n})();\n'''
          js.write_text(text,encoding='utf-8')

          css=Path('enhancements.css')
          c=css.read_text(encoding='utf-8')
          if '/* ACCESSIBILITY-FINAL */' not in c:
              c += '\n/* ACCESSIBILITY-FINAL */\n.closing-code{color:#5d704d!important}\n'
          css.write_text(c,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('width="2048" height="1801"','width="1200" height="1055"')
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit accessibility fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancements.js enhancements.css index.html
          git commit -m 'Improve accessibility without changing visual layout' || exit 0
          git push
