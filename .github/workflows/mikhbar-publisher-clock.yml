name: Mikhbar Publisher Clock

# Lightweight native wakeup/watchdog for the website publisher.
# It never edits publication or social state. It only dispatches the primary
# publisher when the latest story is approaching/past the 20-minute boundary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mikhbar-publisher-clock.yml'
      - 'automation/forum/publisher_wakeup.py'
  schedule:
    # Frequent wakeups reduce GitHub scheduled-event delay risk. The publisher
    # itself still enforces a strict minimum 20-minute gap between posts.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: mikhbar-publisher-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch publisher only when useful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/forum/publisher_wakeup.py --trigger github-native-clock --minimum-age-minutes 18
