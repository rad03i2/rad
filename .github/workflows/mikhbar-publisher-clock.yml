name: Mikhbar Publisher Clock

# Lightweight native wakeup/watchdog for the website publisher.
# It never edits publication or social state. It only dispatches the primary
# publisher when the latest story is approaching/past the 20-minute boundary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mikhbar-publisher-clock.yml'
  schedule:
    # Frequent wakeups reduce GitHub scheduled-event delay risk. The publisher
    # itself still enforces a strict minimum 20-minute gap between posts.
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: mikhbar-publisher-native-watchdog
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch publisher only when useful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          history_path = Path("automation/forum/state/published.json")
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {}
          raw = history.get("last_published_at")
          age_minutes = None

          if raw:
              dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60

          if age_minutes is not None and age_minutes < 18:
              print(f"Latest Mikhbar story is only {age_minutes:.1f} minutes old; no publisher wakeup needed.")
              raise SystemExit(0)

          repository = os.environ["GITHUB_REPOSITORY"]

          # Avoid stacking duplicate publisher runs when multiple wakeup paths
          # fire near the same time.
          runs = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{repository}/actions/workflows/forum-collector.yml/runs",
                  "-f", "per_page=20",
              ],
              capture_output=True,
              text=True,
              check=True,
              env=os.environ,
          )
          payload = json.loads(runs.stdout or "{}")
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("status") in {"queued", "in_progress", "waiting", "pending"}
          ]
          if active:
              print(f"Primary Mikhbar publisher already active ({active[0].get('status')}); skipping duplicate dispatch.")
              raise SystemExit(0)

          endpoint = f"repos/{repository}/actions/workflows/forum-collector.yml/dispatches"
          dispatch_payload = '{"ref":"main","inputs":{"trigger":"github-native-clock"}}'
          subprocess.run(
              ["gh", "api", "--method", "POST", endpoint, "--input", "-"],
              input=dispatch_payload,
              text=True,
              check=True,
              env=os.environ,
          )
          print("Primary Mikhbar publisher dispatched by native watchdog.")
          PY
