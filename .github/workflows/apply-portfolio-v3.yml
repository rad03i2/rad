name: Apply portfolio V3

on:
  push:
    paths:
      - '.github/workflows/apply-portfolio-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild enhancement bundles
        shell: bash
        run: |
          set -euo pipefail
          cat .v3tmp/js_* | base64 -d | gzip -dc > enhancements.js
          cat .v3tmp/css_* | base64 -d | gzip -dc > enhancements.css
          node --check enhancements.js
          test -s enhancements.css

      - name: Add static SEO and social metadata
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- portfolio-v3-head -->'
          block = '''
          <!-- portfolio-v3-head -->
          <meta name="description" content="رضوان عبد الهادي - مطور برمجيات ومشاريع ويب وحاسوب وأتمتة.">
          <meta name="theme-color" content="#111410">
          <meta name="robots" content="index,follow,max-image-preview:large">
          <link rel="canonical" href="https://rad03i2.github.io/rad/">
          <link rel="manifest" href="manifest.webmanifest">
          <link rel="icon" href="assets/rad-icon.svg" type="image/svg+xml">
          <link rel="stylesheet" href="enhancements.css">
          <meta property="og:type" content="website">
          <meta property="og:title" content="رضوان عبدالهادي - مبرمج ومطور">
          <meta property="og:description" content="ملف برمجي لمشاريع الويب والحاسوب والأتمتة.">
          <meta property="og:url" content="https://rad03i2.github.io/rad/">
          <meta property="og:image" content="https://rad03i2.github.io/rad/assets/images/projects/project-20.webp">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="رضوان عبدالهادي - مبرمج ومطور">
          <meta name="twitter:description" content="ملف برمجي لمشاريع الويب والحاسوب والأتمتة.">
          <meta name="twitter:image" content="https://rad03i2.github.io/rad/assets/images/projects/project-20.webp">
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Radwan Abdulhadi","url":"https://rad03i2.github.io/rad/","sameAs":["https://github.com/rad03i2","https://www.instagram.com/rad_03i","https://www.facebook.com/rad03e"],"jobTitle":"Software Developer","knowsAbout":["Python","C#","JavaScript","Web Development","Windows Applications","Automation"]}</script>
          '''
          if marker not in text:
              if '</head>' not in text:
                  raise SystemExit('No </head> found in index.html')
              text = text.replace('</head>', block + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit V3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancements.js enhancements.css index.html
          if git diff --cached --quiet; then
            echo 'No V3 changes to commit.'
            exit 0
          fi
          git commit -m 'Upgrade portfolio to V3 professional experience'
          git push
