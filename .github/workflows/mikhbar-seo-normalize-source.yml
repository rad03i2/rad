name: Mikhbar SEO Source Normalize
# v4: standalone identity cleanup, topic hubs and evergreen pillar guides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/forum/topic_hub_config.py'
      - 'automation/forum/enhance_category_seo.py'
      - 'automation/forum/generate_pillar_pages.py'
      - 'automation/forum/audit_topic_hubs.py'
      - 'automation/forum/audit_pillar_pages.py'
      - '.github/workflows/mikhbar-seo-normalize-source.yml'

permissions:
  contents: write

concurrency:
  group: mikhbar-seo-source-normalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enhance Mikhbar search topic hubs
        run: python automation/forum/enhance_category_seo.py

      - name: Generate evergreen Mikhbar pillar guides
        run: python automation/forum/generate_pillar_pages.py

      - name: Normalize public Mikhbar identity
        run: python automation/forum/normalize_public_identity.py

      - name: Audit Mikhbar topic hubs
        run: python automation/forum/audit_topic_hubs.py

      - name: Audit Mikhbar pillar guides
        run: python automation/forum/audit_pillar_pages.py

      - name: Commit enhanced public files
        shell: bash
        run: |
          git config user.name "Mikhbar SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum
          if git diff --cached --quiet; then
            echo "Mikhbar SEO source is already enhanced and normalized."
            exit 0
          fi
          git commit -m "Mikhbar SEO: refresh topic hubs and evergreen guides"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Enhanced Mikhbar source pushed successfully."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Unable to push enhanced source after retries." >&2
          exit 1
