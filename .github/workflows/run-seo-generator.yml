name: Run SEO V4 safely

on:
  push:
    paths:
      - '.github/workflows/run-seo-generator.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Extract generator from staged workflow
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/seo-v4-generate.yml | sed '1d;$d;s/^          //' > /tmp/seo_v4.py
          python -m py_compile /tmp/seo_v4.py
      - name: Build SEO files
        run: python /tmp/seo_v4.py
      - name: Commit generated SEO layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build SEO V4 discovery and social layer' || exit 0
          git push
