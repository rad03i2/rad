name: Temporary Category Archive Production Fix CI

on:
  push:
    branches:
      - seo/category-archive-production-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate code
        run: |
          python -m py_compile automation/forum/generate_archive_pages.py automation/forum/audit_crawl_graph.py
          node --check cloudflare/mikhbar-site/src/article.js
          node --check cloudflare/mikhbar-site/src/index.js
      - name: Reproduce production SEO sequence
        run: |
          python automation/forum/enhance_category_seo.py
          python automation/forum/generate_pillar_pages.py
          python automation/forum/audit_topic_hubs.py
          python automation/forum/audit_pillar_pages.py
          python automation/forum/generate_archive_pages.py
          python automation/forum/generate_trust_pages.py
          python automation/forum/rebuild_indexes.py
          python automation/forum/audit_multilingual_trust.py
          python automation/forum/audit_crawl_graph.py
      - name: Verify hub-to-archive links
        run: |
          python - <<'PY'
          from pathlib import Path
          for locale in ("ar", "en"):
              for category in ("ai", "robotics", "apps", "computers"):
                  hub = Path(f"forum/{locale}/{category}/index.html").read_text(encoding="utf-8")
                  archive = Path(f"forum/{locale}/{category}/archive/index.html")
                  assert archive.exists(), archive
                  assert 'data-category-archive-link="true"' in hub, (locale, category)
                  assert 'data-category-archive="true"' in archive.read_text(encoding="utf-8")
          print("Production-order category archive links verified")
          PY
      - name: Run Worker tests and build
        run: |
          node --test cloudflare/mikhbar-site/tests/*.test.mjs
          python cloudflare/mikhbar-site/build.py
          python automation/forum/audit_deployed_sitemap.py
          npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
