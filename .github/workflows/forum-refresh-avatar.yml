name: RDWAN Tech Refresh Article Avatar

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rdwan-tech-publication-write
  cancel-in-progress: false

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-avatar]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Re-render all historical articles with portrait cache version
        run: python automation/forum/rerender_all_articles.py
      - name: Commit refreshed article pages
        shell: bash
        run: |
          git config user.name "RDWAN Tech Automation"
          git config user.email "actions@users.noreply.github.com"
          git add forum
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RDWAN Tech: refresh author portrait across historical articles"
          git pull --rebase origin main
          git push origin HEAD:main
