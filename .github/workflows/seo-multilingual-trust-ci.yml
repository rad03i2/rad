name: Temporary Mikhbar Multilingual Trust CI

on:
  push:
    branches:
      - seo/multilingual-trust-phase-4

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: automation/forum/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r automation/forum/requirements.txt
      - name: Validate Python and JavaScript
        run: |
          python -m py_compile automation/forum/build_locale_pages.py automation/forum/generate_pillar_pages.py automation/forum/generate_trust_pages.py automation/forum/audit_multilingual_trust.py automation/forum/indexes.py automation/forum/seo_finalize.py automation/forum/audit_deployed_sitemap.py
          node --check forum/article/article.js
          node --check cloudflare/mikhbar-site/src/article.js
          node --check cloudflare/mikhbar-site/src/index.js
      - name: Regenerate locale pages
        run: python automation/forum/build_locale_pages.py
      - name: Enhance topic hubs
        run: python automation/forum/enhance_category_seo.py
      - name: Generate evergreen guides
        run: python automation/forum/generate_pillar_pages.py
      - name: Generate multilingual trust pages
        run: python automation/forum/generate_trust_pages.py
      - name: Normalize public Mikhbar identity
        run: python automation/forum/normalize_public_identity.py
      - name: Audit topic hubs and guides
        run: |
          python automation/forum/audit_topic_hubs.py
          python automation/forum/audit_pillar_pages.py
      - name: Rebuild discovery files
        run: python automation/forum/rebuild_indexes.py
      - name: Audit multilingual trust
        run: python automation/forum/audit_multilingual_trust.py
      - name: Run forum tests
        run: python -m unittest discover -s automation/forum/tests -v
      - name: Build Cloudflare output
        run: python cloudflare/mikhbar-site/build.py
      - name: Audit deployed indexability
        run: python automation/forum/audit_deployed_sitemap.py
      - name: Verify multilingual trust output
        run: |
          python - <<'PY'
          from pathlib import Path
          errors = []
          root = Path("dist/mikhbar")
          for page in ("about", "contact", "editorial-policy", "corrections", "ai-policy"):
              p = root / "en" / page / "index.html"
              if not p.exists():
                  errors.append(f"missing {p}")
                  continue
              text = p.read_text(encoding="utf-8")
              checks = {
                  "canonical": f'rel="canonical" href="https://mikhbar.website/en/{page}/"',
                  "hreflang ar": 'hreflang="ar"',
                  "hreflang en": 'hreflang="en"',
              }
              for name, needle in checks.items():
                  if needle not in text:
                      errors.append(f"{p}: missing {name}")
              sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
              if f"https://mikhbar.website/en/{page}/" not in sitemap:
                  errors.append(f"sitemap missing /en/{page}/")

          author = root / "en" / "authors" / "radwan-abdulhadi" / "index.html"
          if not author.exists():
              errors.append("missing English author profile")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          if "https://mikhbar.website/en/authors/radwan-abdulhadi/" not in sitemap:
              errors.append("sitemap missing English author profile")

          en_home = (root / "en" / "index.html").read_text(encoding="utf-8")
          for href in ("/en/about/", "/en/editorial-policy/", "/en/contact/"):
              if f'href="{href}"' not in en_home:
                  errors.append(f"English homepage missing {href}")

          ar_about = (root / "about" / "index.html").read_text(encoding="utf-8")
          if 'href="/about/"' not in ar_about:
              errors.append("Arabic About page lost its self/internal About link")

          for p in (root / "en" / "index.html", root / "en" / "ai" / "index.html"):
              if "RDWAN Tech" in p.read_text(encoding="utf-8"):
                  errors.append(f"legacy publication identity remains in {p}")

          if errors:
              for error in errors:
                  print("ERROR:", error)
              raise SystemExit(1)
          print("Multilingual trust output verification passed")
          PY
      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/mikhbar-site/wrangler.preview.toml
