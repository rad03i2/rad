name: Client tools integration temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-tools-integration-temp.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate client tools
        shell: python
        run: |
          from pathlib import Path

          path = Path('enhancements.js')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              "  const facebook = 'https://www.facebook.com/rad03e';",
              "  const facebook = 'https://www.facebook.com/rad03e';\n  const tallyProjectForm = 'https://tally.so/r/RGAekK';\n  const calendlyConsultation = 'https://calendly.com/rdwanbdalhady33/30min';\n  const projectRequestUrl = `${tallyProjectForm}?utm_source=rdwan.dev&utm_medium=website&utm_campaign=project_request`;\n  const consultationUrl = `${calendlyConsultation}?utm_source=rdwan.dev&utm_medium=website&utm_campaign=project_consultation`;",
              'integration constants'
          )

          replace_once(
              "<div class=\"enh-request-row\"><button class=\"enh-primary\" id=\"enhOpenRequest\" type=\"button\" data-i18n=\"request\">${t('request')}</button><a class=\"enh-secondary\" href=\"${instagram}\" target=\"_blank\" rel=\"noopener\">Instagram</a></div>",
              "<div class=\"enh-request-row\"><a class=\"enh-primary\" id=\"enhOpenRequest\" href=\"${projectRequestUrl}\" target=\"_blank\" rel=\"noopener noreferrer\" data-i18n=\"request\">${t('request')}</a><a class=\"enh-secondary\" href=\"${consultationUrl}\" target=\"_blank\" rel=\"noopener noreferrer\">${lang==='ar'?'احجز استشارة':'Book a consultation'}</a><a class=\"enh-secondary\" href=\"${instagram}\" target=\"_blank\" rel=\"noopener\">Instagram</a></div>",
              'services CTA row'
          )
          s = s.replace("    $('#enhOpenRequest').addEventListener('click', openRequestModal);\n", '', 1)

          old_process = "    const items = lang==='ar' ? [['01','الفكرة','نحدد الهدف والمشكلة والنتيجة المطلوبة.'],['02','التخطيط','نرتب الوظائف والأولوية والتجربة المطلوبة.'],['03','التطوير','نبني المزايا خطوة بخطوة مع اختبار مستمر.'],['04','التسليم','نسلّم نسخة منظمة وقابلة للتحديث والتوسعة.']] : [['01','Idea','Define the goal, problem and desired result.'],['02','Plan','Prioritize features and user experience.'],['03','Build','Implement features incrementally with testing.'],['04','Deliver','Provide an organized result that can evolve.']];"
          new_process = "    const items = lang==='ar' ? [['01','الفكرة','تحدد الهدف والنتيجة التي تريد الوصول إليها.'],['02','إرسال الطلب','تعبئ نموذج Tally بتفاصيل المشروع والميزانية والملفات إن وجدت.'],['03','الاستشارة','عند الحاجة تحجز جلسة Calendly لمدة 30 دقيقة لمناقشة المتطلبات.'],['04','الاتفاق','نحدد النطاق والسعر والمدة قبل بدء التنفيذ.'],['05','الدفع والتنفيذ','بعد الاتفاق يتم الدفع الآمن عبر Stripe ثم يبدأ التطوير والاختبار.'],['06','التسليم والمتابعة','بعد التسليم تبقى المتابعة والتحديثات البريدية منظمة عبر Omnisend عند تفعيلها.']] : [['01','Idea','Define the goal and the result you want to achieve.'],['02','Project request','Submit the Tally form with project details, budget and supporting files.'],['03','Consultation','If needed, book a 30-minute Calendly consultation to discuss requirements.'],['04','Agreement','Confirm scope, price and timeline before development starts.'],['05','Payment & build','After agreement, payment is handled securely through Stripe and development begins.'],['06','Delivery & follow-up','After delivery, follow-up and email updates can be organized through Omnisend once activated.']];"
          replace_once(old_process, new_process, 'process steps')

          old_process_html = "    const sec = document.createElement('section'); sec.id='enhProcess'; sec.className='enh-section enh-snap'; sec.innerHTML=`<div class=\"enh-shell\"><div class=\"enh-kicker\" data-i18n=\"process\">${t('process')}</div><h2 class=\"enh-title\" data-i18n=\"processTitle\">${t('processTitle')}</h2><p class=\"enh-subtitle\" data-i18n=\"processSub\">${t('processSub')}</p><div class=\"enh-process-grid\">${items.map(([n,h,p])=>`<article class=\"enh-process-card enh-reveal\"><b>${n}</b><h3>${h}</h3><p>${p}</p></article>`).join('')}</div></div>`;"
          new_process_html = "    const sec = document.createElement('section'); sec.id='enhProcess'; sec.className='enh-section enh-snap'; sec.innerHTML=`<div class=\"enh-shell\"><div class=\"enh-kicker\" data-i18n=\"process\">${t('process')}</div><h2 class=\"enh-title\" data-i18n=\"processTitle\">${t('processTitle')}</h2><p class=\"enh-subtitle\" data-i18n=\"processSub\">${t('processSub')}</p><div class=\"enh-process-grid\">${items.map(([n,h,p])=>`<article class=\"enh-process-card enh-reveal\"><b>${n}</b><h3>${h}</h3><p>${p}</p></article>`).join('')}</div><div class=\"enh-request-row\"><a class=\"enh-primary\" href=\"${projectRequestUrl}\" target=\"_blank\" rel=\"noopener noreferrer\">${lang==='ar'?'ابدأ طلب مشروع':'Start a project request'}</a><a class=\"enh-secondary\" href=\"${consultationUrl}\" target=\"_blank\" rel=\"noopener noreferrer\">${lang==='ar'?'احجز استشارة':'Book a consultation'}</a><small class=\"enh-muted\">${lang==='ar'?'الدفع عبر Stripe متاح بعد الاتفاق على تفاصيل المشروع.':'Stripe payment is provided after the project details are agreed.'}</small></div></div>`;"
          replace_once(old_process_html, new_process_html, 'process HTML')

          replace_once(
              "  function openRequestModal(){addRequestModal();const m=$('#enhRequestModal');m.classList.add('is-open');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('.enh-request-card',m).focus();}",
              "  function openRequestModal(){window.open(projectRequestUrl,'_blank','noopener,noreferrer');}\n  function openConsultation(){window.open(consultationUrl,'_blank','noopener,noreferrer');}",
              'project request action'
          )

          old_faq_ar = "['كيف نبدأ؟','أرسل نوع المشروع والميزات الأساسية والنتيجة التي تريدها، ويمكن استخدام نموذج الطلب في الموقع لتجهيز ملخص واضح.']"
          new_faq_ar = "['كيف نبدأ؟','اضغط «اطلب مشروعك» لإرسال التفاصيل عبر النموذج المخصص، أو اختر «احجز استشارة» إذا كانت الفكرة تحتاج نقاشًا مباشرًا قبل البدء.']"
          replace_once(old_faq_ar, new_faq_ar, 'Arabic FAQ')
          old_faq_en = "['How do we start?','Send the project type, key features and desired result, or use the project request form to generate a concise brief.']"
          new_faq_en = "['How do we start?','Use “Start a project” to submit the dedicated request form, or book a consultation if the idea needs a direct discussion first.']"
          replace_once(old_faq_en, new_faq_en, 'English FAQ')

          old_contact = "<div class=\"enh-contact-actions\"><button class=\"enh-primary\" id=\"enhContactRequest\" type=\"button\" data-i18n=\"request\">${t('request')}</button><a class=\"enh-secondary\" href=\"${instagram}\" target=\"_blank\" rel=\"noopener\">Instagram</a>"
          new_contact = "<div class=\"enh-contact-actions\"><a class=\"enh-primary\" id=\"enhContactRequest\" href=\"${projectRequestUrl}\" target=\"_blank\" rel=\"noopener noreferrer\" data-i18n=\"request\">${t('request')}</a><a class=\"enh-secondary\" href=\"${consultationUrl}\" target=\"_blank\" rel=\"noopener noreferrer\">${lang==='ar'?'احجز استشارة':'Book a consultation'}</a><a class=\"enh-secondary\" href=\"${instagram}\" target=\"_blank\" rel=\"noopener\">Instagram</a>"
          replace_once(old_contact, new_contact, 'contact CTAs')
          s = s.replace("$('#enhContactRequest').addEventListener('click',openRequestModal);", '', 1)

          old_commands = "{label:t('request'),hint:'R',action:openRequestModal},...projects.map"
          new_commands = "{label:t('request'),hint:'R',action:openRequestModal},{label:lang==='ar'?'احجز استشارة':'Book a consultation',hint:'B',action:openConsultation},...projects.map"
          replace_once(old_commands, new_commands, 'command palette')

          path.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          sws = sw.read_text(encoding='utf-8')
          if "rad-portfolio-v3.8.0" not in sws:
              raise SystemExit('service worker cache version changed unexpectedly')
          sw.write_text(sws.replace("rad-portfolio-v3.8.0", "rad-portfolio-v3.9.0", 1), encoding='utf-8')

      - name: Verify JavaScript syntax
        run: node --check enhancements.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enhancements.js service-worker.js
          git diff --cached --check
          git commit -m "Connect project request and consultation flows" || exit 0
          git push origin main
