name: Mikhbar Social Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live]
      story_ids:
        description: Optional comma-separated story IDs to publish/backfill
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ['Mikhbar 20-Minute Publisher']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'automation/social/manual-facebook.json'

permissions:
  contents: write

concurrency:
  group: mikhbar-social-state
  cancel-in-progress: false

jobs:
  social:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      MANUAL_STORY_IDS: ${{ inputs.story_ids }}
    steps:
      - name: Checkout latest website state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test social publishing
        run: python -m unittest discover -s automation/social/tests -v

      - name: Publish Mikhbar stories to Facebook
        if: github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.mode == 'live'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen

          API = 'https://graph.facebook.com/v26.0'
          SITE = 'https://mikhbar.website'
          REQUIRED_USER_SCOPES = {
              'pages_show_list',
              'pages_read_engagement',
              'pages_manage_posts',
          }

          def request_json(path, token, *, method='GET', params=None):
              params = dict(params or {})
              params['access_token'] = token
              if method == 'GET':
                  url = API + path + '?' + urlencode(params)
                  req = Request(url, method='GET')
              else:
                  req = Request(
                      API + path,
                      data=urlencode(params).encode(),
                      method=method,
                      headers={'Content-Type': 'application/x-www-form-urlencoded'},
                  )
              try:
                  with urlopen(req, timeout=45) as response:
                      return json.loads(response.read().decode())
              except HTTPError as exc:
                  body = exc.read().decode(errors='replace')
                  try:
                      payload = json.loads(body)
                      error = payload.get('error', {})
                      safe = {
                          'message': error.get('message'),
                          'type': error.get('type'),
                          'code': error.get('code'),
                          'error_subcode': error.get('error_subcode'),
                          'fbtrace_id': error.get('fbtrace_id'),
                      }
                      raise RuntimeError(
                          f'Facebook Graph API HTTP {exc.code}: '
                          + json.dumps(safe, ensure_ascii=False)
                      ) from None
                  except json.JSONDecodeError:
                      raise RuntimeError(
                          f'Facebook Graph API HTTP {exc.code}: request failed'
                      ) from None

          def absolute_site_url(value):
              value = str(value or '').strip()
              if not value:
                  return ''
              parsed = urlsplit(value)
              if parsed.netloc:
                  if parsed.hostname not in {
                      'mikhbar.website',
                      'www.mikhbar.website',
                      'rdwan.dev',
                      'www.rdwan.dev',
                  }:
                      raise RuntimeError('Article/media URL is outside the Mikhbar website.')
                  return SITE + parsed.path
              return SITE + ('/' if not value.startswith('/') else '') + value

          def clean_excerpt(value, limit=240):
              text = ' '.join(str(value or '').split()).strip()
              if len(text) <= limit:
                  return text
              shortened = text[:limit - 1].rsplit(' ', 1)[0].rstrip('،؛,. ')
              return (shortened or text[:limit - 1]).rstrip() + '…'

          def choose_description(ar):
              candidates = [
                  ar.get('description'),
                  ar.get('deck'),
                  (ar.get('summaryBullets') or [''])[0],
              ]
              for candidate in candidates:
                  value = clean_excerpt(candidate)
                  if len(value) >= 45:
                      return value
              return clean_excerpt(next((x for x in candidates if x), 'أحدث الأخبار التقنية من مِخبار.'))

          root = Path('.')
          history = json.loads(
              (root / 'automation/forum/state/published.json').read_text(encoding='utf-8')
          )
          items = history.get('items', [])
          items_by_id = {str(row.get('story_id')): row for row in items if row.get('story_id')}

          event_name = os.environ.get('GITHUB_EVENT_NAME', '').strip()
          requested = []

          if event_name == 'push':
              manual_path = root / 'automation/social/manual-facebook.json'
              if manual_path.exists():
                  manual = json.loads(manual_path.read_text(encoding='utf-8'))
                  requested = [str(x).strip() for x in manual.get('story_ids', []) if str(x).strip()]
          else:
              raw = os.environ.get('MANUAL_STORY_IDS', '').strip()
              if raw:
                  requested = [x.strip() for x in raw.split(',') if x.strip()]

          if not requested:
              if not items:
                  raise RuntimeError('No published Mikhbar stories are available.')
              requested = [str(items[0].get('story_id'))]

          targets = []
          for story_id in requested:
              item = items_by_id.get(story_id)
              if not item:
                  raise RuntimeError(f'Unknown story_id in published history: {story_id}')
              targets.append(item)

          state_path = root / 'automation/social/state/facebook.json'
          state = (
              json.loads(state_path.read_text(encoding='utf-8'))
              if state_path.exists()
              else {'published_story_ids': []}
          )
          published_ids = set(str(x) for x in state.get('published_story_ids', []))

          page_id = os.environ.get('FACEBOOK_PAGE_ID', '').strip()
          supplied_token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN', '').strip()
          if not page_id:
              raise RuntimeError('FACEBOOK_PAGE_ID is empty.')
          if not supplied_token:
              raise RuntimeError('FACEBOOK_PAGE_ACCESS_TOKEN is empty.')

          me = request_json('/me', supplied_token, params={'fields': 'id,name'})
          effective_token = supplied_token
          token_kind = 'page'

          if str(me.get('id')) != page_id:
              token_kind = 'user'
              permissions = request_json('/me/permissions', supplied_token)
              granted = {
                  row.get('permission')
                  for row in permissions.get('data', [])
                  if row.get('status') == 'granted'
              }
              missing = sorted(REQUIRED_USER_SCOPES - granted)
              if missing:
                  raise RuntimeError(
                      'Facebook User token is missing required permissions: '
                      + ', '.join(missing)
                  )

              accounts = request_json(
                  '/me/accounts',
                  supplied_token,
                  params={'fields': 'id,name,access_token,tasks'},
              )
              match = next(
                  (row for row in accounts.get('data', []) if str(row.get('id')) == page_id),
                  None,
              )
              if not match or not match.get('access_token'):
                  raise RuntimeError(
                      f'Facebook Page {page_id} is not available through this User token.'
                  )
              effective_token = match['access_token']

          page = request_json(
              f'/{page_id}',
              effective_token,
              params={'fields': 'id,name'},
          )
          if str(page.get('id')) != page_id:
              raise RuntimeError(
                  f'Facebook token resolved to Page {page.get("id")}, expected {page_id}.'
              )

          print(json.dumps({
              'facebook_auth': 'ok',
              'token_kind_supplied': token_kind,
              'page_id': page_id,
              'page_name': page.get('name'),
              'requested_count': len(targets),
          }, ensure_ascii=False))

          changed = False
          for item in targets:
              story_id = str(item.get('story_id'))
              if story_id in published_ids:
                  print(json.dumps({
                      'status': 'skipped_duplicate',
                      'story_id': story_id,
                  }, ensure_ascii=False))
                  continue

              article = json.loads((root / item['content_file']).read_text(encoding='utf-8'))
              ar = article.get('locales', {}).get('ar', {})
              title = clean_excerpt(ar.get('title') or item.get('title') or 'خبر جديد', 180)
              description = choose_description(ar)

              article_path = (
                  article.get('urls', {}).get('ar')
                  or item.get('published_urls', {}).get('ar')
                  or item.get('published_url')
              )
              parsed = urlsplit(str(article_path))
              if parsed.netloc and parsed.hostname not in {
                  'mikhbar.website',
                  'www.mikhbar.website',
                  'rdwan.dev',
                  'www.rdwan.dev',
              }:
                  raise RuntimeError('Article URL is outside the Mikhbar website.')
              path = parsed.path
              if path.startswith('/forum/'):
                  path = path[len('/forum'):]
              if not path.startswith('/ar/'):
                  raise RuntimeError('Missing canonical Arabic article URL.')

              link = SITE + path
              link += ('&' if '?' in link else '?') + (
                  'utm_source=facebook&utm_medium=social&utm_campaign=mikhbar_social'
              )

              social_image = article.get('images', {}).get('social')
              image_url = absolute_site_url(social_image) if social_image else ''

              message = (
                  f'{title}\n\n'
                  f'{description}\n\n'
                  f'اقرأ التفاصيل كاملة على مِخبار:\n{link}\n\n'
                  f'#مخبار'
              )

              if image_url:
                  result = request_json(
                      f'/{page_id}/photos',
                      effective_token,
                      method='POST',
                      params={
                          'url': image_url,
                          'caption': message,
                          'published': 'true',
                      },
                  )
                  facebook_post_id = result.get('post_id') or result.get('id')
                  publish_mode = 'photo'
              else:
                  result = request_json(
                      f'/{page_id}/feed',
                      effective_token,
                      method='POST',
                      params={'message': message, 'link': link},
                  )
                  facebook_post_id = result.get('id')
                  publish_mode = 'link_fallback'

              state.setdefault('published_story_ids', []).append(story_id)
              published_ids.add(story_id)
              state['last_success'] = {
                  'story_id': story_id,
                  'facebook_post_id': facebook_post_id,
                  'page_id': page_id,
                  'publish_mode': publish_mode,
                  'image_url': image_url or None,
              }
              changed = True

              print(json.dumps({
                  'status': 'published',
                  'story_id': story_id,
                  'facebook_post_id': facebook_post_id,
                  'page_id': page_id,
                  'publish_mode': publish_mode,
                  'has_image': bool(image_url),
              }, ensure_ascii=False))

          if changed:
              state_path.parent.mkdir(parents=True, exist_ok=True)
              state_path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Commit social state only
        if: always() && (github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.mode == 'live')
        shell: bash
        run: |
          git config user.name 'Mikhbar Social Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/social/state/facebook.json
          if git diff --cached --quiet; then echo 'No social state changes to commit.'; exit 0; fi
          git commit -m 'Mikhbar: record Facebook publishing state'
          git pull --rebase origin main
          git push origin HEAD:main
