name: Mikhbar Social Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - live
  workflow_run:
    workflows: ["Mikhbar 20-Minute Publisher"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: mikhbar-social-state
  cancel-in-progress: false

jobs:
  social:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.MIKHBAR_SOCIAL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METRICOOL_USER_TOKEN: \${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: \${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: \${{ secrets.METRICOOL_BLOG_ID }}
    steps:
      - name: Checkout latest website state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run social unit tests
        run: python -m unittest discover -s automation/social/tests -v

      - name: Resolve execution mode
        id: mode
        shell: bash
        run: |
          if [[ "\${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=\${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Mikhbar social pipeline
        run: python automation/social/pipeline.py --mode "\${{ steps.mode.outputs.value }}"

      - name: Upload social audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikhbar-social-\${{ github.run_number }}
          path: automation/social/state/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit social state only
        shell: bash
        run: |
          git config user.name "Mikhbar Social Automation"
          git config user.email "actions@users.noreply.github.com"
          git add automation/social/state/*.json
          if git diff --cached --quiet; then
            echo "No social state changes to commit."
            exit 0
          fi
          git commit -m "Mikhbar: update social automation state"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Social state pushed safely on attempt \${attempt}."
              exit 0
            fi
            echo "Social state push raced with another update; retrying (\${attempt}/4)."
            sleep $((attempt * 3))
          done
          echo "Unable to push social state after safe retries."
          exit 1
