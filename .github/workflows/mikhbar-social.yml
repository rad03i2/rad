name: Mikhbar Social Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live]
  workflow_run:
    workflows: ['Mikhbar 20-Minute Publisher']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: mikhbar-social-state
  cancel-in-progress: false

jobs:
  social:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Checkout latest website state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish new Mikhbar story to Facebook
        if: github.event_name == 'workflow_run' || inputs.mode == 'live'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          root = Path('.')
          history = json.loads((root / 'automation/forum/state/published.json').read_text(encoding='utf-8'))
          item = history['items'][0]
          article = json.loads((root / item['content_file']).read_text(encoding='utf-8'))
          ar = article.get('locales', {}).get('ar', {})
          title = ar.get('title') or item.get('title') or 'خبر جديد'
          description = ar.get('description') or ar.get('deck') or ''
          path = article.get('urls', {}).get('ar') or item.get('published_url')
          link = 'https://rdwan.dev' + path if str(path).startswith('/') else str(path)
          link += ('&' if '?' in link else '?') + 'utm_source=facebook&utm_medium=social&utm_campaign=mikhbar_social'
          story_id = str(item.get('story_id') or article.get('id') or link.split('?', 1)[0])
          state_path = root / 'automation/social/state/facebook.json'
          state = json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {'published_story_ids': []}
          if story_id in state.get('published_story_ids', []):
              print(json.dumps({'status':'skipped_duplicate','story_id':story_id}, ensure_ascii=False))
              raise SystemExit(0)
          message = f'{title}\\n\\n{description}\\n\\nاقرأ التفاصيل على مِخبار:\\n{link}\\n\\n#مخبار'
          endpoint = f"https://graph.facebook.com/{os.environ['FACEBOOK_PAGE_ID']}/feed"
          data = urlencode({'message': message, 'link': link}).encode()
          req = Request(endpoint, data=data, method='POST', headers={'Authorization': 'Bearer ' + os.environ['FACEBOOK_PAGE_ACCESS_TOKEN']})
          with urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode())
          state.setdefault('published_story_ids', []).append(story_id)
          state['last_success'] = {'story_id': story_id, 'facebook_post_id': result.get('id'), 'page_id': os.environ['FACEBOOK_PAGE_ID']}
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status':'published','story_id':story_id,'facebook_post_id':result.get('id'),'page_id':os.environ['FACEBOOK_PAGE_ID']}, ensure_ascii=False))
          PY
      - name: Commit social state only
        if: always() && (github.event_name == 'workflow_run' || inputs.mode == 'live')
        shell: bash
        run: |
          git config user.name 'Mikhbar Social Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/social/state/facebook.json
          if git diff --cached --quiet; then echo 'No social state changes to commit.'; exit 0; fi
          git commit -m 'Mikhbar: record Facebook publishing state'
          git pull --rebase origin main
          git push origin HEAD:main
