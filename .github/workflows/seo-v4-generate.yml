name: Build SEO V4

on:
  push:
    paths:
      - '.github/workflows/seo-v4-generate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Generate indexable pages, social cards and discovery files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, html, re
          from datetime import datetime, timezone
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          ROOT = Path('.')
          SITE = 'https://rad03i2.github.io/rad'
          OWNER = 'rad03i2'
          INDEXNOW_KEY = 'ff7de3f199bfcac8fda652aec7caabcd'
          now = datetime.now(timezone.utc)
          today = now.date().isoformat()

          data = json.loads(Path('projects.json').read_text(encoding='utf-8'))['projects']
          descriptions = {
            '01':'برنامج Windows لإدارة الملفات وإعادة التسمية الجماعية وفحص التكرار.',
            '02':'مختبر برمجي لتجارب الروبوتات والتحكم والحساسات باستخدام أكثر من لغة.',
            '03':'مجموعة أدوات Python للملفات والنصوص والمهام اليومية السريعة.',
            '04':'تجارب JavaScript وواجهات ويب صغيرة تركز على التفاعل والتخزين المحلي.',
            '05':'أدوات وتجارب إنتاجية مرتبطة بالذكاء الاصطناعي ومعالجة النصوص.',
            '06':'مجموعة أتمتة لأعمال Windows المتكررة والاختصارات وسير العمل.',
            '07':'أدوات لفحص النظام والتخزين وتنفيذ مهام صيانة آمنة.',
            '08':'مكونات واجهات عربية RTL قابلة لإعادة الاستخدام في المواقع واللوحات.',
            '09':'نموذج نظام لإدارة بيانات الطلاب والدرجات وقاعدة البيانات.',
            '10':'أدوات لمعالجة الملفات وتجميعها وإعادة تسميتها واستخراج المعلومات منها.',
            '11':'لوحة عرض لقراءات الحساسات والقياسات المرتبطة بمشاريع إنترنت الأشياء.',
            '12':'دفاتر تحليل بيانات تشمل الاستكشاف والإحصاءات والرسوم.',
            '13':'مختبر تعليمي لمفاهيم أمان الويب والممارسات الدفاعية.',
            '14':'قاعدة بداية لتطبيقات الهاتف وتجارب Android وPython Kivy.',
            '15':'تطبيقات تدريبية للخوارزميات والبحث والفرز وهياكل البيانات.',
            '16':'سكربتات Python لأتمتة الملفات والتقارير والنسخ الاحتياطي.',
            '17':'مشاريع Fullstack صغيرة تربط الواجهة بالخادم وقاعدة البيانات.',
            '18':'تجربة موقع شخصي متجاوب لعرض الهوية والمهارات والمشاريع.',
            '19':'واجهة Portfolio لعرض الأعمال البرمجية بصورة منظمة.',
            '20':'الموقع الرئيسي الحالي لعرض الهوية والمشاريع وروابط التواصل.'
          }
          english = {
            '01':'A Windows file-management utility for batch renaming, previews and duplicate detection.',
            '02':'A multi-language robotics lab for control, sensors and ROS-oriented experiments.',
            '03':'A practical Python toolbox for files, text and lightweight automation.',
            '04':'A JavaScript lab for interactive UI experiments and local-storage workflows.',
            '05':'Productivity experiments around AI-assisted workflows and text processing.',
            '06':'A desktop automation suite for recurring Windows tasks and keyboard-driven workflows.',
            '07':'A Windows toolkit for system inspection, storage visibility and safe maintenance tasks.',
            '08':'Reusable RTL interface components for Arabic websites and dashboards.',
            '09':'A student-management sample covering records, grades and database-backed workflows.',
            '10':'Utilities for inspecting, grouping, renaming and processing files.',
            '11':'A dashboard for sensor readings and Internet of Things experiments.',
            '12':'Data-analysis notebooks for exploration, statistics and visualization.',
            '13':'A defensive web-security learning lab focused on safer development practices.',
            '14':'A starter kit for Android and Python/Kivy mobile application experiments.',
            '15':'C++ exercises for algorithms, searching, sorting and data structures.',
            '16':'A hub of Python scripts for file, report and backup automation.',
            '17':'Small full-stack projects connecting interfaces, servers and databases.',
            '18':'A responsive developer portfolio experiment for presenting skills and work.',
            '19':'A portfolio interface for presenting software and web projects.',
            '20':'The main RAD portfolio presenting identity, projects and contact links.'
          }

          def slugify(s):
              s = s.lower().replace('++','pp').replace('#','sharp').replace('/',' ')
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')

          for p in data:
              p['slug'] = slugify(p['name'])
              p['path'] = f"projects/{p['number']}-{p['slug']}.html"
              p['url'] = f"{SITE}/{p['path']}"
              p['desc_ar'] = descriptions[p['number']]
              p['desc_en'] = english[p['number']]
              p['github'] = f"https://github.com/{OWNER}/{p['repo']}"

          Path('projects').mkdir(exist_ok=True)
          Path('services').mkdir(exist_ok=True)
          Path('assets/social').mkdir(parents=True, exist_ok=True)
          Path('.well-known').mkdir(exist_ok=True)

          # Social cards: 1200x630 JPG for broad preview compatibility.
          try:
              font_big = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 52)
              font_small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 25)
          except Exception:
              font_big = ImageFont.load_default(); font_small = ImageFont.load_default()

          def social_card(src, out, title, subtitle='Radwan Abdulhadi · Software Developer'):
              im = Image.open(src).convert('RGB')
              bg = ImageOps.fit(im, (1200,630), method=Image.Resampling.LANCZOS)
              overlay = Image.new('RGBA', bg.size, (0,0,0,0))
              d = ImageDraw.Draw(overlay)
              d.rectangle((0,410,1200,630), fill=(8,12,9,218))
              d.rectangle((0,408,1200,412), fill=(198,241,108,230))
              d.text((58,455), title, font=font_big, fill=(246,248,244,255))
              d.text((60,540), subtitle, font=font_small, fill=(190,198,187,255))
              out_im = Image.alpha_composite(bg.convert('RGBA'), overlay).convert('RGB')
              out_im.save(out, 'JPEG', quality=88, optimize=True, progressive=True)

          for p in data:
              src = Path(f"assets/images/projects/project-{p['number']}.webp")
              if src.exists(): social_card(src, f"assets/social/project-{p['number']}.jpg", p['name'])
          home_src = Path('assets/images/projects/project-20.webp')
          if home_src.exists(): social_card(home_src, 'assets/social/home.jpg', 'Radwan Abdulhadi', 'Software Developer Portfolio · RAD')

          common_css = """
          :root{color-scheme:dark;--bg:#0f120e;--panel:#171b16;--text:#f3f6ef;--muted:#a5aca1;--lime:#c6f16c;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Arabic',sans-serif;line-height:1.8}a{color:inherit}.wrap{width:min(1040px,calc(100% - 36px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-weight:800;text-decoration:none}.back{color:var(--muted);text-decoration:none}.hero{padding:64px 0 34px}.eyebrow{color:var(--lime);font-size:13px;font-weight:700}.hero h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.15;margin:8px 0 18px}.lead{max-width:780px;color:var(--muted);font-size:1.08rem}.image{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:26px;border:1px solid var(--line);margin:28px 0}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:28px;padding:10px 0 70px}.card{padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{padding:11px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--line)}.btn.primary{background:var(--lime);color:#131811;border-color:var(--lime)}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:28px 0 70px}.item{display:block;padding:20px;border:1px solid var(--line);border-radius:20px;text-decoration:none;background:var(--panel)}.item small{color:var(--lime)}.item p{color:var(--muted);margin:8px 0 0}.footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}.ltr{direction:ltr;text-align:left}@media(max-width:760px){.grid,.list{grid-template-columns:1fr}.hero{padding-top:44px}}
          """

          person_schema = {
            '@type':'Person','@id':f'{SITE}/#person','name':'رضوان عبد الهادي','alternateName':['Radwan Abdulhadi','Radwan Abdulhadi Ahmed','Radwan Abd Alhady','RAD'],
            'url':f'{SITE}/','sameAs':[f'https://github.com/{OWNER}','https://www.instagram.com/rad_03i','https://www.facebook.com/rad03e'],
            'jobTitle':'Software Developer','knowsAbout':['Web Development','Desktop Applications','Python','C#','JavaScript','Automation','Android']
          }

          def schemas(*items):
              return json.dumps({'@context':'https://schema.org','@graph':list(items)}, ensure_ascii=False)

          # Individual, crawlable project pages.
          for i,p in enumerate(data):
              prevp = data[i-1] if i else None; nextp = data[i+1] if i+1 < len(data) else None
              image = f"{SITE}/assets/social/project-{p['number']}.jpg"
              tags = ''.join(f'<span class="tag">{html.escape(t)}</span>' for t in p['tags'])
              nav = []
              if prevp: nav.append(f'<a class="btn" href="../{prevp["path"]}">المشروع السابق</a>')
              if nextp: nav.append(f'<a class="btn" href="../{nextp["path"]}">المشروع التالي</a>')
              page_schema = {
                '@type':'WebPage','@id':p['url']+'#webpage','url':p['url'],'name':p['name']+' | Radwan Abdulhadi',
                'description':p['desc_ar'],'inLanguage':['ar','en'],'isPartOf':{'@id':f'{SITE}/#website'},'about':{'@id':f'{p["url"]}#software'}
              }
              code_schema = {
                '@type':'SoftwareSourceCode','@id':f'{p["url"]}#software','name':p['name'],'description':p['desc_en'],
                'codeRepository':p['github'],'programmingLanguage':p['tags'],'author':{'@id':f'{SITE}/#person'},'url':p['url']
              }
              breadcrumb = {'@type':'BreadcrumbList','itemListElement':[
                {'@type':'ListItem','position':1,'name':'Radwan Abdulhadi','item':SITE+'/'},
                {'@type':'ListItem','position':2,'name':'Projects','item':SITE+'/projects/'},
                {'@type':'ListItem','position':3,'name':p['name'],'item':p['url']}
              ]}
              doc=f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{html.escape(p['name'])} | مشروع برمجي — رضوان عبد الهادي</title><meta name="description" content="{html.escape(p['desc_ar'])} مشروع من أعمال رضوان عبد الهادي مع التقنيات ورابط المصدر على GitHub."><meta name="author" content="Radwan Abdulhadi"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="{p['url']}"><link rel="author" href="{SITE}/about-radwan-abdulhadi.html">
<meta property="og:type" content="website"><meta property="og:site_name" content="Radwan Abdulhadi Portfolio"><meta property="og:locale" content="ar_IQ"><meta property="og:locale:alternate" content="en_US"><meta property="og:title" content="{html.escape(p['name'])} — Radwan Abdulhadi"><meta property="og:description" content="{html.escape(p['desc_ar'])}"><meta property="og:url" content="{p['url']}"><meta property="og:image" content="{image}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="{html.escape(p['name'])}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{html.escape(p['name'])} — Radwan Abdulhadi"><meta name="twitter:description" content="{html.escape(p['desc_en'])}"><meta name="twitter:image" content="{image}"><link rel="icon" href="../assets/rad-icon.svg"><style>{common_css}</style><script type="application/ld+json">{schemas(person_schema,page_schema,code_schema,breadcrumb)}</script></head><body>
<div class="wrap"><header class="top"><a class="brand" href="../index.html">&lt;RAD /&gt;</a><a class="back" href="index.html">كل المشاريع</a></header><main><section class="hero"><div class="eyebrow">PROJECT {p['number']}</div><h1>{html.escape(p['name'])}</h1><p class="lead">{html.escape(p['desc_ar'])}</p><p class="lead ltr" lang="en">{html.escape(p['desc_en'])}</p></section><img class="image" src="../assets/images/projects/project-{p['number']}.webp" alt="صورة مشروع {html.escape(p['name'])}" loading="eager"><section class="grid"><article class="card"><h2>عن المشروع</h2><p>{html.escape(p['desc_ar'])}</p><h3>التقنيات</h3><div class="tags">{tags}</div><div class="btns"><a class="btn primary" href="{p['github']}" target="_blank" rel="noopener">عرض المصدر على GitHub</a><a class="btn" href="../index.html#projects">العودة للموقع</a></div></article><aside class="card"><h2>هوية المشروع</h2><p><strong>المطور:</strong> رضوان عبد الهادي</p><p><strong>المستودع:</strong> {html.escape(p['repo'])}</p><p><strong>الترتيب:</strong> Project {p['number']}</p><div class="btns">{''.join(nav)}</div></aside></section></main><footer class="footer">Radwan Abdulhadi · Software Developer · <a href="https://github.com/{OWNER}">GitHub</a></footer></div></body></html>'''
              Path(p['path']).write_text(doc,encoding='utf-8')

          # Project directory.
          cards=''.join(f'''<a class="item" href="{p['number']}-{p['slug']}.html"><small>PROJECT {p['number']}</small><h2>{html.escape(p['name'])}</h2><p>{html.escape(p['desc_ar'])}</p></a>''' for p in data)
          itemlist={'@type':'ItemList','name':'Radwan Abdulhadi Projects','numberOfItems':len(data),'itemListElement':[{'@type':'ListItem','position':i+1,'url':p['url'],'name':p['name']} for i,p in enumerate(data)]}
          projects_page=f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشاريع رضوان عبد الهادي | Radwan Abdulhadi Projects</title><meta name="description" content="دليل مشاريع رضوان عبد الهادي البرمجية في الويب وWindows وPython والأتمتة والهواتف والبيانات."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{SITE}/projects/"><meta property="og:type" content="website"><meta property="og:title" content="Radwan Abdulhadi — Projects"><meta property="og:description" content="20 software projects across web, desktop, Python, automation and mobile."><meta property="og:url" content="{SITE}/projects/"><meta property="og:image" content="{SITE}/assets/social/home.jpg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="../assets/rad-icon.svg"><style>{common_css}</style><script type="application/ld+json">{schemas(person_schema,itemlist)}</script></head><body><div class="wrap"><header class="top"><a class="brand" href="../index.html">&lt;RAD /&gt;</a><a class="back" href="../about-radwan-abdulhadi.html">عن رضوان</a></header><main><section class="hero"><div class="eyebrow">PROJECT DIRECTORY</div><h1>مشاريعي الخاصة</h1><p class="lead">دليل قابل للفهرسة يربط كل مشروع بصفحته الخاصة ومستودعه على GitHub.</p></section><section class="list">{cards}</section></main><footer class="footer">Radwan Abdulhadi · <a href="https://github.com/{OWNER}">GitHub</a> · <a href="../services/">الخدمات</a></footer></div></body></html>'''
          Path('projects/index.html').write_text(projects_page,encoding='utf-8')

          # Identity page, useful for exact-name/entity searches.
          about_url=f'{SITE}/about-radwan-abdulhadi.html'
          about_schema={'@type':'ProfilePage','@id':about_url+'#profile','url':about_url,'name':'رضوان عبد الهادي | Radwan Abdulhadi','mainEntity':{'@id':f'{SITE}/#person'}}
          about=f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رضوان عبد الهادي | Radwan Abdulhadi — Software Developer</title><meta name="description" content="الصفحة التعريفية الرسمية لرضوان عبد الهادي (Radwan Abdulhadi)، مطور برمجيات يعمل على الويب وتطبيقات الحاسوب وPython وC# وJavaScript والأتمتة."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="{about_url}"><meta property="og:type" content="profile"><meta property="og:site_name" content="Radwan Abdulhadi Portfolio"><meta property="og:title" content="رضوان عبد الهادي | Radwan Abdulhadi"><meta property="og:description" content="Software developer portfolio, projects, GitHub and contact profiles."><meta property="og:url" content="{about_url}"><meta property="og:image" content="{SITE}/assets/social/home.jpg"><meta name="twitter:card" content="summary_large_image"><link rel="me" href="https://github.com/{OWNER}"><link rel="me" href="https://www.instagram.com/rad_03i"><link rel="me" href="https://www.facebook.com/rad03e"><link rel="icon" href="assets/rad-icon.svg"><style>{common_css}</style><script type="application/ld+json">{schemas(person_schema,about_schema)}</script></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">&lt;RAD /&gt;</a><a class="back" href="projects/">المشاريع</a></header><main><section class="hero"><div class="eyebrow">OFFICIAL PROFILE</div><h1>رضوان عبد الهادي<br><span dir="ltr">Radwan Abdulhadi</span></h1><p class="lead">مطور برمجيات مهتم بتطوير مواقع الويب، تطبيقات Windows، أدوات Python وC# وJavaScript، الأتمتة، وتجارب تطبيقات الهاتف.</p><p class="lead ltr" lang="en">Radwan Abdulhadi is a software developer building web, desktop, automation and mobile-oriented projects.</p><div class="btns"><a class="btn primary" href="https://github.com/{OWNER}">GitHub</a><a class="btn" href="https://www.instagram.com/rad_03i">Instagram</a><a class="btn" href="https://www.facebook.com/rad03e">Facebook</a><a class="btn" href="projects/">مشاريعي</a></div></section><section class="grid"><article class="card"><h2>الاسم والهوية الرقمية</h2><p>رضوان عبد الهادي — Radwan Abdulhadi — Radwan Abdulhadi Ahmed. هذه الصفحة تربط الهوية الرسمية بالموقع ومستودعات GitHub وحسابات التواصل المدرجة أعلاه.</p></article><aside class="card"><h2>مجالات العمل</h2><div class="tags"><span class="tag">Web</span><span class="tag">Windows</span><span class="tag">Python</span><span class="tag">C#</span><span class="tag">JavaScript</span><span class="tag">Automation</span><span class="tag">Mobile</span></div></aside></section></main><footer class="footer"><a href="services/">الخدمات</a> · <a href="projects/">المشاريع</a></footer></div></body></html>'''
          Path('about-radwan-abdulhadi.html').write_text(about,encoding='utf-8')

          # Services directory.
          service_items=[('web-development','تطوير مواقع الويب','واجهات ومواقع متجاوبة باستخدام تقنيات الويب الحديثة.'),('windows-apps','تطبيقات Windows','أدوات وتطبيقات سطح مكتب تركّز على الإنتاجية وإدارة الملفات.'),('python-automation','Python والأتمتة','سكربتات وأدوات لأتمتة المهام ومعالجة الملفات والبيانات.'),('mobile-apps','تطبيقات الهاتف','تجارب وقواعد بداية لتطبيقات Android وPython/Kivy.'),('ai-tools','أدوات الذكاء الاصطناعي','أدوات إنتاجية وتجارب مرتبطة بالذكاء الاصطناعي ومعالجة النصوص.'),('data-iot','البيانات وIoT','لوحات ودفاتر تحليل ومشاريع حساسات وإنترنت الأشياء.')]
          scards=''.join(f'<article class="item"><small>SERVICE</small><h2 id="{s}">{t}</h2><p>{d}</p></article>' for s,t,d in service_items)
          services_url=f'{SITE}/services/'
          services=f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات البرمجة | رضوان عبد الهادي — Radwan Abdulhadi</title><meta name="description" content="خدمات ومجالات رضوان عبد الهادي في تطوير الويب، تطبيقات Windows، Python، الأتمتة، تطبيقات الهاتف، أدوات AI والبيانات."><meta name="robots" content="index,follow"><link rel="canonical" href="{services_url}"><meta property="og:title" content="Software Development Services — Radwan Abdulhadi"><meta property="og:description" content="Web, desktop, Python automation, mobile and AI-oriented development."><meta property="og:url" content="{services_url}"><meta property="og:image" content="{SITE}/assets/social/home.jpg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="../assets/rad-icon.svg"><style>{common_css}</style><script type="application/ld+json">{schemas(person_schema,{'@type':'WebPage','url':services_url,'name':'خدمات البرمجة — رضوان عبد الهادي','about':{'@id':f'{SITE}/#person'}})}</script></head><body><div class="wrap"><header class="top"><a class="brand" href="../index.html">&lt;RAD /&gt;</a><a class="back" href="../projects/">المشاريع</a></header><main><section class="hero"><div class="eyebrow">SERVICES</div><h1>خدمات ومجالات العمل</h1><p class="lead">مجالات برمجية يمكن استكشافها عبر المشاريع المنشورة والمستودعات المرتبطة بها.</p></section><section class="list">{scards}</section></main><footer class="footer"><a href="../about-radwan-abdulhadi.html">عن رضوان</a> · <a href="../projects/">المشاريع</a></footer></div></body></html>'''
          Path('services/index.html').write_text(services,encoding='utf-8')

          # Sitemap.
          urls=[f'{SITE}/',about_url,f'{SITE}/projects/',services_url] + [p['url'] for p in data]
          sitemap='''<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'''+''.join(f'  <url><loc>{u}</loc><lastmod>{today}</lastmod><changefreq>{"weekly" if u==SITE+"/" else "monthly"}</changefreq><priority>{"1.0" if u==SITE+"/" else "0.8"}</priority></url>\n' for u in urls)+'</urlset>\n'
          Path('sitemap.xml').write_text(sitemap,encoding='utf-8')

          # RSS feed for project discovery.
          items=''.join(f'''<item><title>{html.escape(p['name'])}</title><link>{p['url']}</link><guid isPermaLink="true">{p['url']}</guid><description>{html.escape(p['desc_en'])}</description></item>''' for p in data)
          rss=f'''<?xml version="1.0" encoding="UTF-8"?><rss version="2.0"><channel><title>Radwan Abdulhadi Projects</title><link>{SITE}/</link><description>Software projects by Radwan Abdulhadi</description><language>ar</language>{items}</channel></rss>'''
          Path('feed.xml').write_text(rss,encoding='utf-8')

          # AI/search discovery summaries.
          Path('llms.txt').write_text(f'''# Radwan Abdulhadi\n\nOfficial software developer portfolio: {SITE}/\n\n## Identity\n- Arabic: رضوان عبد الهادي\n- English: Radwan Abdulhadi\n- GitHub: https://github.com/{OWNER}\n- Instagram: https://www.instagram.com/rad_03i\n- Facebook: https://www.facebook.com/rad03e\n\n## Primary pages\n- Profile: {about_url}\n- Projects: {SITE}/projects/\n- Services: {services_url}\n- Sitemap: {SITE}/sitemap.xml\n- RSS: {SITE}/feed.xml\n\n## Projects\n'''+''.join(f'- [{p["name"]}]({p["url"]}) — {p["desc_en"]}\n' for p in data),encoding='utf-8')
          Path('llms-full.txt').write_text('Radwan Abdulhadi / رضوان عبد الهادي — Software Developer\n\n'+ '\n\n'.join(f'''PROJECT {p['number']} — {p['name']}\nArabic: {p['desc_ar']}\nEnglish: {p['desc_en']}\nTechnologies: {', '.join(p['tags'])}\nPage: {p['url']}\nRepository: {p['github']}''' for p in data),encoding='utf-8')
          Path('humans.txt').write_text('''/* TEAM */\nDeveloper: Radwan Abdulhadi\nArabic: رضوان عبد الهادي\nGitHub: https://github.com/rad03i2\nInstagram: https://www.instagram.com/rad_03i\nFacebook: https://www.facebook.com/rad03e\n\n/* SITE */\nLanguages: Arabic, English\nTechnologies: HTML, CSS, JavaScript\n''',encoding='utf-8')
          Path('.well-known/security.txt').write_text(f'''Contact: {SITE}/#contact\nCanonical: {SITE}/.well-known/security.txt\nPreferred-Languages: ar, en\nExpires: 2027-09-15T00:00:00Z\n''',encoding='utf-8')
          Path('opensearch.xml').write_text(f'''<?xml version="1.0" encoding="UTF-8"?><OpenSearchDescription xmlns="http://a9.com/-/spec/opensearch/1.1/"><ShortName>RAD Portfolio</ShortName><Description>Search Radwan Abdulhadi projects</Description><InputEncoding>UTF-8</InputEncoding><Url type="text/html" template="{SITE}/?q={{searchTerms}}#projects"/></OpenSearchDescription>''',encoding='utf-8')

          # IndexNow ownership key.
          Path(f'{INDEXNOW_KEY}.txt').write_text(INDEXNOW_KEY,encoding='utf-8')

          # Robots tuned for broad indexing, with sitemap/feed discovery.
          Path('robots.txt').write_text(f'''User-agent: *\nAllow: /\n\nSitemap: {SITE}/sitemap.xml\n\n# AI/search discovery\n# llms: {SITE}/llms.txt\n''',encoding='utf-8')

          # Replace homepage SEO tags with one authoritative block.
          index=Path('index.html').read_text(encoding='utf-8')
          index=re.sub(r'<!-- SEO-V4 START -->.*?<!-- SEO-V4 END -->','',index,flags=re.S)
          # Remove common duplicate SEO/meta tags produced by earlier iterations.
          patterns=[
            r'<link\s+rel=["\']canonical["\'][^>]*>\s*',
            r'<meta\s+name=["\'](?:description|author|robots|twitter:[^"\']+)["\'][^>]*>\s*',
            r'<meta\s+property=["\']og:[^"\']+["\'][^>]*>\s*'
          ]
          for pat in patterns: index=re.sub(pat,'',index,flags=re.I)
          home_schema = schemas(
            person_schema,
            {'@type':'WebSite','@id':f'{SITE}/#website','url':f'{SITE}/','name':'Radwan Abdulhadi Portfolio','alternateName':['RAD Portfolio','رضوان عبد الهادي'],'inLanguage':['ar','en'],'publisher':{'@id':f'{SITE}/#person'}},
            {'@type':'ProfilePage','@id':f'{SITE}/#profilepage','url':f'{SITE}/','name':'رضوان عبد الهادي — Radwan Abdulhadi','mainEntity':{'@id':f'{SITE}/#person'}},
            itemlist
          )
          head=f'''<!-- SEO-V4 START -->\n<meta name="description" content="الموقع الرسمي لرضوان عبد الهادي (Radwan Abdulhadi)، مطور برمجيات يعرض مشاريع الويب وWindows وPython وC# وJavaScript والأتمتة والهاتف.">\n<meta name="author" content="Radwan Abdulhadi">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<link rel="canonical" href="{SITE}/">\n<link rel="alternate" type="application/rss+xml" title="Radwan Abdulhadi Projects" href="{SITE}/feed.xml">\n<link rel="sitemap" type="application/xml" href="{SITE}/sitemap.xml">\n<link rel="search" type="application/opensearchdescription+xml" title="RAD Portfolio" href="{SITE}/opensearch.xml">\n<link rel="me" href="https://github.com/{OWNER}">\n<link rel="me" href="https://www.instagram.com/rad_03i">\n<link rel="me" href="https://www.facebook.com/rad03e">\n<meta property="og:type" content="profile">\n<meta property="og:site_name" content="Radwan Abdulhadi Portfolio">\n<meta property="og:locale" content="ar_IQ">\n<meta property="og:locale:alternate" content="en_US">\n<meta property="og:title" content="رضوان عبد الهادي | Radwan Abdulhadi — Software Developer">\n<meta property="og:description" content="Software developer portfolio featuring web, desktop, Python, C#, JavaScript, automation and mobile-oriented projects.">\n<meta property="og:url" content="{SITE}/">\n<meta property="og:image" content="{SITE}/assets/social/home.jpg">\n<meta property="og:image:secure_url" content="{SITE}/assets/social/home.jpg">\n<meta property="og:image:type" content="image/jpeg">\n<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">\n<meta property="og:image:alt" content="Radwan Abdulhadi Software Developer Portfolio">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Radwan Abdulhadi — Software Developer">\n<meta name="twitter:description" content="Web, desktop, Python, C#, JavaScript, automation and mobile projects by Radwan Abdulhadi.">\n<meta name="twitter:image" content="{SITE}/assets/social/home.jpg">\n<meta name="twitter:image:alt" content="Radwan Abdulhadi Portfolio">\n<script type="application/ld+json" id="seo-v4-schema">{home_schema}</script>\n<!-- SEO-V4 END -->'''
          index=index.replace('</head>',head+'\n</head>',1)
          index=re.sub(r'<!-- SEO-DISCOVERY START -->.*?<!-- SEO-DISCOVERY END -->','',index,flags=re.S)
          discover=f'''<!-- SEO-DISCOVERY START --><nav class="seo-discovery-links" aria-label="دليل الموقع"><a href="about-radwan-abdulhadi.html">عن رضوان عبد الهادي</a><a href="projects/">دليل المشاريع</a><a href="services/">الخدمات</a><a href="feed.xml">RSS</a></nav><!-- SEO-DISCOVERY END -->'''
          index=index.replace('</body>',discover+'\n</body>',1)
          Path('index.html').write_text(index,encoding='utf-8')

          css=Path('enhancements.css').read_text(encoding='utf-8')
          marker='/* SEO-V4 discovery */'
          if marker in css: css=css.split(marker)[0].rstrip()+'\n'
          css += marker+'''\n.seo-discovery-links{width:min(1200px,calc(100% - 48px));margin:0 auto 28px;padding:14px 0;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--enh-muted);font-size:12px}.seo-discovery-links a{color:inherit;text-decoration:none}.seo-discovery-links a:hover{color:var(--enh-lime)}@media(max-width:640px){.seo-discovery-links{width:calc(100% - 32px);gap:12px}}\n'''
          Path('enhancements.css').write_text(css,encoding='utf-8')

          # Persistent IndexNow workflow; it safely skips until the public site is reachable.
          wf=f'''name: Notify IndexNow\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'index.html'\n      - 'about-radwan-abdulhadi.html'\n      - 'projects/**'\n      - 'services/**'\n      - 'sitemap.xml'\n      - 'feed.xml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  notify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Submit public URLs to IndexNow\n        shell: bash\n        env:\n          SITE_URL: {SITE}\n          INDEXNOW_KEY: {INDEXNOW_KEY}\n        run: |\n          if ! curl -fsS --max-time 12 "$SITE_URL/" >/dev/null; then\n            echo "Public site is not reachable yet; skipping IndexNow without failing."\n            exit 0\n          fi\n          python - <<'PY2' > /tmp/indexnow.json\n          import xml.etree.ElementTree as ET, json, os\n          ns={{'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}}\n          root=ET.parse('sitemap.xml').getroot()\n          urls=[x.text for x in root.findall('.//s:loc',ns) if x.text]\n          site=os.environ['SITE_URL']\n          print(json.dumps({{'host':site.split('://',1)[1].split('/')[0],'key':os.environ['INDEXNOW_KEY'],'keyLocation':site+'/'+os.environ['INDEXNOW_KEY']+'.txt','urlList':urls}}))\n          PY2\n          curl -fsS -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json\n          echo "IndexNow submission sent."\n'''
          Path('.github/workflows/indexnow.yml').write_text(wf,encoding='utf-8')

          # Ready-to-run Pages workflow after the one-time Pages source setting is enabled.
          deploy='''name: Deploy GitHub Pages\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/configure-pages@v5\n      - uses: actions/upload-pages-artifact@v4\n        with:\n          path: '.'\n      - name: Deploy\n        id: deployment\n        uses: actions/deploy-pages@v4\n'''
          Path('.github/workflows/deploy-pages.yml').write_text(deploy,encoding='utf-8')

          Path('SEO-SETUP.md').write_text(f'''# SEO deployment checklist\n\nThe technical SEO layer targets the expected GitHub Pages URL: `{SITE}/`.\n\n## One-time publishing step\n1. Repository **Settings → Pages**.\n2. Under **Build and deployment**, set Source to **GitHub Actions**.\n3. Run the **Deploy GitHub Pages** workflow.\n\n## Search engines\n- Verify `{SITE}/` in Google Search Console, then submit `{SITE}/sitemap.xml`.\n- Verify/import the site in Bing Webmaster Tools. IndexNow is already configured in `.github/workflows/indexnow.yml`; it starts submitting automatically once the public URL responds successfully.\n\n## Important\nIndexNow and sitemap submission speed up discovery, but no search engine guarantees immediate crawling, indexing, or first-place rankings.\n''',encoding='utf-8')
          PY
      - name: Commit SEO V4 output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build SEO V4 discovery and social layer' || exit 0
          git push
