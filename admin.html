<!doctype html><html lang="ar" dir="rtl"><head><script id="canonical-host-redirect">(()=>{const h=location.hostname.toLowerCase();if(h==='www.rdwan.dev'||location.protocol==='http:'){location.replace('https://rdwan.dev'+location.pathname+location.search+location.hash)}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RAD Local Project Editor</title><style>body{margin:0;background:#111410;color:#eef4e7;font-family:system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:36px auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.note{color:#aeb6aa;line-height:1.8;max-width:760px}.grid{display:grid;gap:10px;margin-top:22px}.row{display:grid;grid-template-columns:70px 1.2fr 1fr 1fr;gap:8px;padding:12px;border:1px solid #30382d;border-radius:14px;background:#171b16}.row input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #374132;border-radius:9px;background:#111410;color:#eef4e7}button,a.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #3a4434;border-radius:999px;background:#171b16;color:#eef4e7;text-decoration:none;cursor:pointer}button.primary{background:#c6f16c;color:#111410;border-color:#c6f16c;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:12px;color:#c6f16c;font-size:13px}@media(max-width:760px){.row{grid-template-columns:1fr}.row::before{content:'Project';color:#8f988c;font-size:11px}}</style>
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/radwan-favicon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/radwan-favicon-180.png">
</head><body><main class="wrap"><div class="top"><div><h1>محرر بيانات المشاريع المحلي</h1><p class="note">هذه الصفحة لا ترسل أي كلمة مرور أو Token إلى GitHub. تعدّل نسخة محلية من <code>projects.json</code> ثم تصدّر الملف الجديد، وبعدها ترفعه أنت إلى المستودع أو تطلب مني استبداله.</p></div><a class="btn" href="./">العودة للموقع</a></div><div class="actions"><button class="primary" id="load">تحميل المشاريع</button><button id="add">إضافة مشروع</button><button id="export">تنزيل projects.json</button><button id="copy">نسخ JSON</button></div><div id="status" class="status"></div><div id="grid" class="grid"></div></main><script>let data={version:1,projects:[]};const g=document.getElementById('grid'),s=document.getElementById('status');async function load(){try{data=await fetch('projects.json',{cache:'no-store'}).then(r=>r.json());render();s.textContent='تم تحميل البيانات.'}catch(e){s.textContent='تعذر تحميل projects.json.'}}function render(){g.innerHTML='';data.projects.forEach((p,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${p.number||''}" data-k="number"><input value="${p.name||''}" data-k="name"><input value="${p.repo||''}" data-k="repo"><input value="${(p.tags||[]).join(', ')}" data-k="tags">`;r.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.k;data.projects[i][k]=k==='tags'?inp.value.split(',').map(x=>x.trim()).filter(Boolean):inp.value}));g.appendChild(r)})}document.getElementById('load').onclick=load;document.getElementById('add').onclick=()=>{data.projects.push({number:String(data.projects.length+1).padStart(2,'0'),name:'New Project',repo:'',categories:[],tags:[]});render()};document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='projects.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(data,null,2));s.textContent='تم نسخ JSON.'};load();</script></body></html>
