name = "mikhbar-production"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = false

[assets]
directory = "../../dist/mikhbar"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "mikhbar.website"
custom_domain = true

[[routes]]
pattern = "www.mikhbar.website"
custom_domain = true
